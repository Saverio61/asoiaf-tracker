<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivio delle Saghe</title>
<style>
  :root{
    --carta:#f6f0e4; --carta2:#efe6d3; --inchiostro:#2b2420; --tenue:#6f6256;
    --accento:#7a2a2a; --accento2:#a9553a; --linea:#d9ccb4; --scheda:#fffaf0; --evid:#f2e3b8;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-tema="scuro"]{
    --carta:#1d1a17; --carta2:#26221e; --inchiostro:#e9e0d1; --tenue:#a99d8c;
    --accento:#d28a6e; --accento2:#e0a37f; --linea:#3a342d; --scheda:#2a2520; --evid:#4a3d22;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:var(--serif);line-height:1.6}
  button,select,input{font:inherit;color:inherit}
  a{color:var(--accento)}
  header.top{position:sticky;top:0;z-index:5;background:var(--carta2);border-bottom:1px solid var(--linea);padding:10px 16px}
  .riga{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1{font-size:1.15rem;margin:0;letter-spacing:.02em;color:var(--accento)}
  .spazio{flex:1}
  select,input[type=search]{background:var(--scheda);border:1px solid var(--linea);border-radius:6px;padding:6px 9px;font-family:var(--sans);font-size:.88rem}
  .btn{background:var(--scheda);border:1px solid var(--linea);border-radius:6px;padding:6px 11px;cursor:pointer;font-family:var(--sans);font-size:.85rem}
  .btn:hover{border-color:var(--accento)}
  .btn.on{background:var(--accento);color:#fff;border-color:var(--accento)}
  .tabs{display:flex;gap:4px;margin-top:8px}
  .tab{padding:6px 14px;border:1px solid var(--linea);border-bottom:none;border-radius:6px 6px 0 0;background:var(--scheda);cursor:pointer;font-family:var(--sans);font-size:.88rem}
  .tab.on{background:var(--carta);color:var(--accento);font-weight:600}
  .barra-leggo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--sans);font-size:.83rem;color:var(--tenue);margin-top:8px}
  main{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 140px)}
  aside{border-right:1px solid var(--linea);padding:12px;background:var(--carta2);overflow:auto;max-height:calc(100vh - 140px);position:sticky;top:130px}
  section.pannello{padding:22px clamp(16px,4vw,48px);max-width:900px}
  .voce{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer}
  .voce:hover{background:var(--scheda);border-color:var(--linea)}
  .voce.sel{background:var(--scheda);border-color:var(--accento)}
  .voce .n{font-family:var(--sans);font-size:.72rem;color:var(--tenue);display:block}
  .voce .t{font-weight:600}
  .voce .p{font-family:var(--sans);font-size:.76rem;color:var(--tenue)}
  .voce.bloccata{opacity:.5;cursor:not-allowed}
  .nota-aside{font-family:var(--sans);font-size:.78rem;color:var(--tenue);padding:6px 4px}
  h2.cap{margin:0 0 4px;font-size:1.7rem;color:var(--accento)}
  .meta{font-family:var(--sans);font-size:.83rem;color:var(--tenue);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px 16px}
  .breve{font-style:italic;border-left:3px solid var(--accento2);padding:4px 12px;margin:0 0 18px;background:var(--scheda)}
  .sinossi p{margin:0 0 14px;text-align:justify;hyphens:auto}
  .badge{display:inline-block;font-family:var(--sans);font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--accento2);color:var(--accento2);margin-left:6px}
  .gruppo{margin:18px 0 6px}
  .gruppo h3{font-family:var(--sans);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tenue);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--sans);font-size:.82rem;background:var(--scheda);border:1px solid var(--linea);border-radius:99px;padding:3px 11px;cursor:pointer}
  .chip:hover{border-color:var(--accento);color:var(--accento)}
  .nota{background:var(--evid);border-radius:6px;padding:10px 14px;margin:18px 0;font-size:.95rem}
  .fonte{font-family:var(--sans);font-size:.8rem;color:var(--tenue);border-top:1px solid var(--linea);margin-top:24px;padding-top:10px}
  .azioni{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .scheda{background:var(--scheda);border:1px solid var(--linea);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
  .scheda:hover{border-color:var(--accento)}
  .scheda .tp{font-family:var(--sans);font-size:.7rem;color:var(--accento2);text-transform:uppercase;letter-spacing:.07em}
  .scheda .nm{font-weight:600}
  .scheda .en{font-family:var(--sans);font-size:.76rem;color:var(--tenue)}
  .filtri{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .elenco-cap{list-style:none;margin:0;padding:0}
  .elenco-cap li{padding:5px 0;border-bottom:1px dotted var(--linea)}
  .vuoto{color:var(--tenue);font-style:italic;padding:30px 0}
  #areaStampa{display:none}
  @media (max-width:760px){
    main{grid-template-columns:1fr}
    aside{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--linea)}
  }
  @media print{
    :root{--carta:#fff;--carta2:#fff;--scheda:#fff;--inchiostro:#000;--tenue:#444;--linea:#bbb;--accento:#000;--accento2:#444;--evid:#eee}
    header.top,aside,.azioni,.no-stampa,.chip{display:none!important}
    .chips{display:block}
    .chips .chip{display:inline!important;border:none;padding:0;background:none;font-size:.9rem}
    .chips .chip::after{content:", "}
    .chips .chip:last-child::after{content:""}
    main{display:block}
    section.pannello{padding:0;max-width:none}
    body.stampa-libro main{display:none}
    body.stampa-libro #areaStampa{display:block}
    #areaStampa .capitolo-stampa{page-break-after:always}
    #areaStampa .capitolo-stampa:last-child{page-break-after:auto}
    .sinossi p{text-align:left}
    a{text-decoration:none;color:#000}
  }
</style>
</head>
<body>
<header class="top">
  <div class="riga">
    <h1>📜 Archivio delle Saghe</h1>
    <select id="selSaga" aria-label="Saga"></select>
    <select id="selLibro" aria-label="Libro"></select>
    <span class="spazio"></span>
    <input id="cerca" type="search" placeholder="Cerca capitoli o voci…" aria-label="Cerca">
    <button class="btn" id="btnTema" title="Chiaro/scuro">🌗</button>
  </div>
  <div class="tabs">
    <div class="tab on" data-vista="capitoli">Capitoli</div>
    <div class="tab" data-vista="database">Database</div>
    <div class="tab" data-vista="info">Info e fonti</div>
  </div>
  <div class="barra-leggo">
    <label><input type="checkbox" id="chkAnti"> Modalità anti-spoiler</label>
    <span id="boxLetto" style="display:none">Letto fino a: <select id="selLetto"></select></span>
    <span id="msgSpoiler"></span>
  </div>
</header>

<main>
  <aside id="laterale"></aside>
  <section class="pannello" id="pannello"></section>
</main>
<div id="areaStampa"></div>

        {
          n: 0, titolo: "Prologo", pov: "Will", luogo: "Foresta infestata, oltre la Barriera", pagina: "1 (US HC)",
          url: "https://awoiaf.westeros.org/index.php/A_Game_of_Thrones-Prologue",
          breve: "Tre esploratori della Guardia della Notte seguono le tracce di un gruppo di razziatori bruti oltre la Barriera e si imbattono negli Estranei.",
          sinossi: [
            "Gared, Will e ser Waymar Royce, tre esploratori della Guardia della Notte, stanno seguendo le tracce di una banda di razziatori bruti nella foresta infestata, a nord della Barriera. Will ha riferito di aver trovato dei bruti e di averli visti tutti morti. Gared, un uomo anziano che veste il nero da decenni, è a disagio e insiste perché tornino alla Barriera: li aspettano otto o nove giorni di viaggio, che possono diventare quindici se nevica. Waymar, un giovane di nobile nascita di diciotto anni, ha il comando; dopo aver preso in giro le paure di Gared, chiede di nuovo a Will i particolari di ciò che ha visto.",
            "Will spiega di aver visto l'accampamento dei bruti: il riparo di fortuna era coperto di neve, non c'era alcun fuoco e nessuno si è mosso per tutto il tempo in cui li ha osservati. Giacevano a terra come morti, ma non si vedeva sangue. Waymar suggerisce che dormissero, ma Will insiste che sono morti. C'era anche una donna su un albero, e nemmeno lei si muoveva. Gared pensa che siano stati uccisi dal freddo, ma Waymar fa notare che il tempo non è stato abbastanza rigido da gelare degli uomini in quel modo. Chiede a Will di guidarli fino ai bruti morti.",

            "Will e Waymar salgono sulla cresta, Waymar molto più rumoroso di Will. Giunto al suo punto di osservazione, Will vede che i corpi sono spariti. Waymar, in piedi e ben visibile in cima alla cresta, ride degli avvertimenti di Will che gli intima di abbassarsi. Deciso a ritrovare i bruti e a fare del suo primo incarico di esplorazione un successo, Waymar ordina a Will di arrampicarsi su un albero e cercare un fuoco.",

          ],
          note: "Il Prologo introduce la minaccia soprannaturale (gli Estranei) prima della politica del titolo. Nota: Gared sconsiglia di avanzare e viene ignorato; Waymar mostra coraggio proprio all'ultimo.",

            "È il nono anno d'estate. Bran Stark, sette anni, viaggia con un gruppo di venti uomini, tra cui il padre, lord Eddard Stark, per assistere all'esecuzione di una condanna del re in un fortino sulle colline. È la prima volta che gli è permesso partecipare. Il fratello maggiore, Robb, pensa che il condannato sia un bruto fedele a Mance Rayder, il Re-oltre-la-Barriera, e questo fa tornare in mente a Bran i racconti della Vecchia Nan sui bruti.",

          sinossi: [

            "Da mezzo anno l'esule pretendente Viserys Targaryen e la sorella tredicenne, la principessa Daenerys Targaryen, vivono nella dimora di Illyrio Mopatis, magister della città libera di Pentos. Viserys vuole riconquistare il Trono di Spade che fu di suo padre e ha bisogno di un esercito, che spera di ottenere con un'alleanza matrimoniale con un khal dothraki a capo di un grande khalasar.",
            "Viserys porta a Daenerys un dono del magister Illyrio, un bell'abito di seta. Daenerys deve apparire come la principessa che è, perché il khal Drogo ne chieda la mano. Daenerys dubita dei motivi di Illyrio, ma Viserys insiste che il magister voglia solo guadagnarsi la sua benevolenza. Per paura di far arrabbiare il fratello (cosa che lui chiama «svegliare il drago»), Daenerys tace la propria diffidenza. Viserys la avverte di non deluderlo e, per sottolineare la minaccia, le torce un capezzolo. Secondo Viserys, quando si scriverà la storia del suo regno, si dirà che il suo regno è iniziato quella notte.",
            "Viserys se ne va, lasciando Daenerys sola con i suoi pensieri. Lei teme il banchetto di quella sera e la sua mente corre a Westeros, la patria che non ha mai visto. Fu concepita poco prima che la madre, la regina Rhaella Targaryen, fuggisse da Approdo del Re con Viserys, e nacque nove mesi dopo a Roccia del Drago. Conosce però i racconti di Viserys: la fuga da Approdo del Re a Roccia del Drago; il fratello maggiore, il principe Rhaegar Targaryen, morto in battaglia contro Robert Baratheon al Tridente; il Saccheggio di Approdo del Re, la morte atroce del principe Aegon Targaryen e l'uccisione del padre, re Aerys II Targaryen, nella sala del trono, per mano di un cavaliere della sua stessa Guardia Reale.",
            "Nove mesi dopo la morte del fratello e del padre, la madre morì nel darla alla luce, durante una tempesta estiva che distrusse gran parte della flotta Targaryen, ultima difesa di Roccia del Drago (cosa che Viserys non le ha mai perdonato). Quando la guarnigione di Roccia del Drago era pronta a consegnare Viserys e Daenerys a Stannis Baratheon, in arrivo per prendere l'isola, ser Willem Darry e quattro uomini fedeli li portarono in segreto a Braavos. Là vissero in una grande casa con la porta rossa. Ma Willem morì, lasciandoli senza tutore, e i servi rubarono il denaro rimasto. Poco dopo i due vennero cacciati dalla casa e iniziarono a spostarsi di città in città, senza fermarsi mai a lungo, perché Viserys temeva gli assassini dell'Usurpatore. Daenerys ricorda come ricchi mercanti, arconti e magister fossero sempre meno disposti a ospitare i Targaryen col passare degli anni, e come Viserys sia stato costretto a vendere la corona della madre. Nonostante la mancanza di appoggi, Viserys è ossessionato dal riprendersi il Trono di Spade. Daenerys sa che alle sue spalle lo chiamano «il re mendicante» e si chiede se anche a lei abbiano dato un soprannome.",
            "I servi di Illyrio vengono a lavarla e prepararla per il banchetto offerto nella dimora di Drogo, dove dovrà conoscere e colpire il khal, perché ne chieda la mano. I servi le dicono quanto è fortunata a sposare un uomo così ricco che persino i suoi schiavi portano collari d'oro. Quando è vestita a dovere, il fratello torna con il magister Illyrio e le ordina di alzarsi e girarsi. Illyrio la ricopre di complimenti, mentre Viserys si lamenta che sia troppo magra e troppo giovane. Illyrio lo rassicura: è abbastanza grande per il khal, e ne ammira i capelli argento-oro e gli occhi viola, marchio dell'antica nobiltà valyriana. Quando Viserys osserva che i barbari hanno gusti bizzarri come ragazzi e pecore, Illyrio lo avverte di non dire certe cose al khal Drogo, e negli occhi di Viserys balena la rabbia.",
            "I tre viaggiano nella lettiga di Illyrio fino alla dimora di Drogo nel buio più fitto. Viserys afferma che diecimila «urlatori» dothraki basteranno a rovesciare l'Usurpatore, uniti a quelli che a Westeros attendono il suo ritorno. Fa congetture su chi si unirebbe alla causa: Casa Tyrell, Casa Redwyne, Casa Darry, Casa Greyjoy e i dorniani. Illyrio assicura a Viserys che nei Sette Regni la gente attende in segreto il suo ritorno, anche se Daenerys ne dubita.",
            "Illyrio dice che la dimora di Drogo è un dono dei magister di Pentos, per conquistarne l'amicizia. Arrivano alla villa e vengono annunciati come re Viserys III e la principessa Daenerys. Illyrio indica alcuni ospiti illustri, tra cui ser Jorah Mormont, fuggito alcuni anni prima dai Sette Regni sotto condanna a morte e da allora spesso tra i dothraki. Poi Illyrio indica lo stesso khal Drogo, aggraziato come una pantera e più giovane di quanto Daenerys si aspettasse. Viserys nota la lunga treccia, che significa che non è mai stato sconfitto in combattimento. Daenerys nota solo il suo volto freddo e duro, e ne ha paura. Chiede di tornare a casa, provocando una sfuriata di Viserys sul fatto che la loro casa è stata loro portata via. Daenerys intendeva solo le sue stanze nella tenuta di Illyrio, ma nessuno dei luoghi in cui hanno vissuto è mai stato la casa di Viserys. Viserys le assicura inoltre che lascerebbe stuprare lei da tutto il khalasar di Drogo, cavalli compresi, se ciò gli restituisse i Sette Regni. Poi le dice di smettere di piangere, perché Illyrio sta conducendo Drogo da loro. Daenerys smette di piangere, si raddrizza e sorride."
          ],
          note: "Primo capitolo fuori da Westeros: la storia dei Targaryen in esilio e il piano di Viserys. Dettagli utili: il «drago» che Viserys non deve svegliare, il soprannome «re mendicante», la treccia di Drogo.",
          presenti: ["daenerys", "viserys", "illyrio", "drogo", "jorah"],

        {
          n: 4, titolo: "Eddard I", pov: "Eddard Stark", luogo: "Grande Inverno", pagina: "33 (US HC)",
          url: "https://awoiaf.westeros.org/index.php/A_Game_of_Thrones-Chapter_4",
          breve: "Re Robert arriva a Grande Inverno, offre a Eddard il posto di Primo Cavaliere e propone un fidanzamento tra Sansa e Joffrey.",
          sinossi: [
            "Il seguito del re, trecento persone, entra a cavallo a Grande Inverno. Eddard riconosce ser Jaime Lannister, Tyrion Lannister, il principe Joffrey Baratheon e Sandor Clegane, ma non riconosce il vecchio amico re Robert finché questi non lo chiama. Eddard è sconvolto nel vedere che Robert è ingrassato di otto stone (112 libbre) da quando si sono visti l'ultima volta, nove anni prima, durante la Ribellione di Greyjoy. Eddard rende omaggio mentre la regina Cersei e i figli minori scendono dalla carrozza. Dopo i convenevoli, con le presentazioni dei figli di entrambe le parti, Robert insiste per essere condotto nelle cripte di Grande Inverno, dove riposano i morti della Casa Stark, per rendere omaggio alla sorella di Eddard. La regina Cersei obietta, ma Robert la ignora e il fratello gemello la allontana discretamente.",
            "Ned chiede a Robert del viaggio e Robert si lamenta della distanza da percorrere nell'immenso vuoto del nord. Poi descrive i vantaggi di vivere al sud, dicendo a Ned che deve vederne le meraviglie, il calore e le donne poco vestite.",
            "Scendono nella cripta, impresa faticosa per Robert, fuori forma. Vuole visitare la tomba della sorella di Ned, Lyanna Stark, che era la sua promessa sposa. Passano davanti ai morti della Casa Stark, con le statue davanti alle tombe, ciascun lord con una spada in grembo e un metalupo ai piedi. Arrivano all'ultima delle cripte occupate. Qui ci sono tre tombe, per il padre di Ned, Rickard, per il fratello maggiore Brandon e per la sorella Lyanna. Robert dichiara che Ned avrebbe dovuto seppellire Lyanna su una collina soleggiata, ma Ned spiega che era una Stark di Grande Inverno e che il suo posto è lì, come lei desiderava. Ned ricorda la morte di lei, con solo lui e l'amico Howland Reed vicini, mentre Robert ricorda la vendetta su Rhaegar Targaryen per ciò che ha fatto a Lyanna, rammaricandosi di averlo potuto uccidere una volta sola. Ned propone di tornare in superficie, dove li attende la moglie di Robert. Robert risponde che gli Estranei possono prendersi sua moglie, ma si avviano comunque.",
            "Mentre tornano, Ned chiede di Jon Arryn e Robert dichiara di non aver mai visto un uomo morire così in fretta: da sano a morto nel giro di quindici giorni. Ned chiede come stia sopportando il lutto la vedova Lysa, spiegando che Catelyn teme per la sorella. Robert confida di pensare che la morte di Jon abbia fatto impazzire Lysa e che questa abbia riportato il figlio, Robert Arryn, al Nido dell'Aquila. Robert aveva sperato di mandare il ragazzo malaticcio a fare da pupillo a Tywin Lannister, ma Lysa non ne ha voluto sapere ed è partita nel cuore della notte; Cersei era furiosa. Ned, che non si fida di Tywin, è sollevato. Ned chiede di poter prendere lui stesso Robert Arryn come pupillo, ma Tywin ha già accettato e Ned che lo prendesse come pupillo sarebbe un insulto per Tywin.",
            "Ned osserva che Robert dovrebbe visitare la Barriera, ma Robert risponde di avere preoccupazioni più importanti, come sostituire lord Arryn, che ricopriva diversi incarichi importanti, tra cui quello di Guardiano dell'Est. Ned ricorda a Robert che quel titolo spetta per tradizione ai domini della Casa Arryn, ma Robert dichiara che non nominerà Guardiano dell'Est il piccolo Robert Arryn, di soli sei anni,. Ned fa notare che in tempo di pace il titolo è solo un onore. Il re non è contento: il figlio non è il padre, anche se magari, quando il ragazzo sarà cresciuto, il titolo gli verrà restituito. Robert dice di aver bisogno anche di un nuovo Primo Cavaliere del Re e offre il posto a Ned perché possano lavorare di nuovo insieme. Poi racconta a Ned quanto i doveri lo annoino e si lamenta di essere circondato da adulatori e sciocchi. Insiste che vuole Ned a sud, ad Approdo del Re, come Primo Cavaliere, il secondo uomo più importante del regno.",
            "Ned non vuole il posto e cerca di dichiararsi indegno dell'onore. Robert risponde scherzando che non vuole onorare Ned ma farsi governare il regno da lui, citando il detto popolare per cui «il re mangia e il Primo Cavaliere caga». Robert chiede almeno un sorriso, ma Ned risponde che si dice che nel Nord faccia così freddo che la risata di un uomo gli si gela in gola e lo soffoca.",
            "Re Robert propone anche di dare in sposa a Sansa Stark, undici anni, figlia di Ned, suo figlio, il principe Joffrey, per unire le Case Stark e Baratheon come dovevano fare lui e Lyanna. Ned esita a decidere, desiderando parlare con la moglie, ma Robert gli chiede di non metterci troppo. Ned è colmo di un senso di presagio, sapendo che Grande Inverno è il suo posto e che l'inverno sta arrivando."
          ],
          note: "L'arrivo della corte. Elementi chiave: la richiesta di diventare Primo Cavaliere, la proposta di matrimonio Sansa–Joffrey, la fiducia di Ned in Robert contrapposta al suo timore per i Lannister.",

        {
          n: 5, titolo: "Jon I", pov: "Jon Snow", luogo: "Grande Inverno", pagina: "",
          url: "https://awoiaf.westeros.org/index.php/A_Game_of_Thrones-Chapter_5",
          breve: "Al banchetto per la visita del re, Jon parla con lo zio Benjen e con Tyrion Lannister.",
          sinossi: [
            "A Grande Inverno si tiene un banchetto in onore della visita di re Robert I Baratheon. Jon decide di essere grato che la sua condizione di bastardo lo abbia relegato in fondo alla sala, con gli scudieri più giovani, invece che al tavolo della famiglia del re. Qui può bere quanto vuole (ha la sete di un uomo) e mescolarsi liberamente con chi gli sta intorno.",
            "Jon osserva il re e la sua famiglia mentre entrano. Riconosce il falso sorriso della regina Cersei ed è deluso da re Robert, grasso e rosso in viso. La principessa Myrcella, otto anni, sembra presa dal suo accompagnatore, Robb Stark, e Jon la giudica insulsa. Arya Stark è accompagnata dal grassoccio e giovane principe Tommen Baratheon. Il principe ereditario, il dodicenne Joffrey Baratheon (più alto persino di Robb), accompagna la radiosa Sansa Stark. A Jon non piacciono le labbra imbronciate di Joffrey né il disprezzo che il principe sembra nutrire per Grande Inverno. Nota anche che il fratello della regina, ser Jaime Lannister, sembra un vero re, e che il nano Tyrion Lannister, che avanza ondeggiando, è grottescamente affascinante, tanto brutto quanto Jaime e Cersei sono belli. Gli ultimi a entrare sono Benjen Stark e Theon Greyjoy.",
            "Jon dà da mangiare al suo metalupo, Spettro, sotto il tavolo e lo osserva tenere testa in silenzio a un cane adulto tre volte più grande di lui. Portare il lupo al banchetto è un altro vantaggio dell'essere il bastardo. Presto Jon è raggiunto dallo zio Benjen, che gli chiede quanto abbia bevuto, aggiungendo che Jon è più grande di quando lui si ubriacò davvero per la prima volta. Benjen chiede di Spettro e Jon spiega di averlo chiamato così per il colore bianco e perché non fa mai un rumore. Poi Benjen chiede perché Jon non sia al tavolo principale e Jon risponde secco che lady Catelyn ha pensato che far sedere un bastardo col re potesse offenderlo.",
            "Benjen osserva che Eddard non sembra in vena di festeggiare e Jon aggiunge che nemmeno la regina, probabilmente per la visita di re Robert alle cripte di Grande Inverno. Benjen elogia l'acutezza di Jon e osserva che alla Barriera gli servirebbe un uomo come lui. Jon chiede se può tornare alla Barriera con Benjen. Lo zio risponde che la Barriera è un luogo duro per un ragazzo, ma Jon ribatte che alla prossima festa del suo nome compirà quindici anni e che si dice che i bastardi crescano più in fretta dei nati in nozze. Jon pensa a come tutti i suoi fratellastri e sorellastre abbiano un futuro, mentre per un bastardo non c'è futuro. Benjen dice che dovrebbe prima conoscere una donna e generare uno o due bastardi, per sapere a cosa rinuncerà. Questo fa arrabbiare Jon, che dichiara che non genererà mai un bastardo e corre via con Spettro alle calcagna prima che qualcuno lo veda piangere.",
            "Mentre se ne va, Tyrion Lannister gli parla da una sporgenza nel cortile deserto e chiede se può dare un'occhiata a Spettro. Jon si offre di aiutarlo a scendere, ma Tyrion salta giù, atterrando acrobaticamente sulle mani e rimettendosi in piedi con un balzo. Spettro è incerto riguardo a Tyrion, ma si sottopone all'esame per ordine di Jon. Tyrion chiede se Jon sia il bastardo di Eddard. Jon si irrigidisce e Tyrion si scusa dicendo che, essendo un nano, di solito può parlare come gli pare, come un giullare. Commenta che Jon sembra avere più del nord in sé dei suoi fratellastri. Tyrion consiglia a Jon di non dimenticare mai chi e cosa è, in modo che nessuno possa usarlo contro di lui. Quando Jon gli chiede che cosa potrebbe saperne lui dell'essere bastardo, Tyrion risponde che tutti i nani sono bastardi agli occhi del padre e che, sebbene tutti i nani siano bastardi, non tutti i bastardi devono essere nani."
          ],
          note: "Prima voce di Jon: il suo desiderio di unirsi alla Guardia della Notte e il consiglio di Tyrion («non dimenticare mai chi sei»). Il banchetto introduce quasi tutti i figli del re e degli Stark.",
          presenti: ["jon", "spettro", "benjen", "tyrion", "robert", "cersei", "jaime", "joffrey", "myrcella", "tommen", "sansa", "arya", "robb", "theon", "eddard"],

      b.capitoli.forEach(function(c){
        if(!visibile(b,c)) return;
        var ruoli=[];
        CAMPI.forEach(function(k){ if((c[k[0]]||[]).indexOf(id)>=0) ruoli.push(k[1]); });
        if(ruoli.length) out.push({libro:b, cap:c, ruoli:ruoli});
      });
    });
    return out;
  }
  function entitaVisibili(){
    var tutte = saga().entita;
    if(!st.anti) return tutte;
    return tutte.filter(function(e){ return apparizioni(e.id).length>0; });
  }

  /* ---------- intestazione ---------- */
  function iniziaIntestazione(){
    var sg=document.getElementById("selSaga");
    sg.innerHTML = DATA.map(function(s,i){return '<option value="'+i+'">'+esc(s.nome)+'</option>';}).join("");
    sg.value = st.saga;
    aggiornaSelLibro();
    document.getElementById("chkAnti").checked = st.anti;
    document.documentElement.setAttribute("data-tema", st.tema==="scuro"?"scuro":"chiaro");
  }
  function aggiornaSelLibro(){
    var sl=document.getElementById("selLibro");
    sl.innerHTML = saga().libri.map(function(b,i){return '<option value="'+i+'">'+esc(b.titolo)+' ('+esc(b.titoloEn)+')</option>';}).join("");
    st.libro = Math.min(st.libro, saga().libri.length-1);
    sl.value = st.libro;
  }
  function aggiornaLetto(){
    var box=document.getElementById("boxLetto"), sel=document.getElementById("selLetto"), msg=document.getElementById("msgSpoiler");
    box.style.display = st.anti ? "inline" : "none";
    var b=libro();
    var opz='<option value="-1">Nessun capitolo</option>' + b.capitoli.map(function(c){return '<option value="'+c.n+'">'+esc(c.titolo)+'</option>';}).join("");
    sel.innerHTML=opz; sel.value=String(lettoFino(b));
    msg.textContent = st.anti ? "Mostro solo ciò che hai già letto." : "Tutti i capitoli sono visibili (anche gli spoiler).";
  }

  /* ---------- vista capitoli ---------- */
  function listaCapitoli(){
    var b=libro(), h='', q=norm(st.q);
    var mancanti = b.totaleCapitoli - b.capitoli.length;
    b.capitoli.forEach(function(c){
      if(q && norm(c.titolo+" "+c.pov+" "+c.luogo+" "+(c.sinossi||[]).join(" ")).indexOf(q)<0) return;
      var ok=visibile(b,c);
      h+='<button class="voce '+(st.cap===c.n&&ok?'sel':'')+(ok?'':' bloccata')+'" data-cap="'+c.n+'" '+(ok?'':'disabled')+'>'+
         '<span class="n">'+(c.etichetta||(c.n===0?'Prologo':'Capitolo '+c.n))+(ok?'':' · 🔒 non ancora letto')+'</span>'+
         '<span class="t">'+esc(c.titolo)+'</span>'+
         '<span class="p">'+(ok?esc(c.pov):'')+'</span></button>';
    });
    if(!h) h='<div class="nota-aside">Nessun capitolo trovato.</div>';
    if(mancanti>0 && !q) h+='<div class="nota-aside">Ne mancano '+mancanti+': li aggiungiamo man mano che leggi.</div>';
    return h;
  }
  function chipGruppo(titolo, ids){
    if(!ids||!ids.length) return '';
    var voci = ids.map(function(id){var e=entita(id); return e?'<span class="chip" data-ent="'+esc(id)+'">'+esc(e.nome)+'</span>':'';}).join("");
    return '<div class="gruppo"><h3>'+esc(titolo)+'</h3><div class="chips">'+voci+'</div></div>';
  }
  function htmlCapitolo(b,c,conAzioni){
    var h='';
    if(conAzioni){
      h+='<div class="azioni no-stampa"><button class="btn" data-az="stampa">🖨️ Stampa / PDF questo capitolo</button><button class="btn" data-az="stampa-libro">🖨️ Stampa il libro (capitoli visibili)</button>'+
         (c.url?'<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(c.url)+'">Apri la fonte ↗</a>':'')+'</div>';
    }
    h+='<h2 class="cap">'+esc(c.titolo)+(c.stato==="sintetica"?'<span class="badge">sinossi da approfondire</span>':'')+(c.stato==="da_scrivere"?'<span class="badge">da scrivere</span>':'')+'</h2>';
    if(c.titoloEn) h+='<div class="meta"><span>'+esc(c.titoloEn)+'</span></div>';
    h+='<div class="meta"><span><b>'+esc(b.titolo)+'</b> · '+(c.etichetta||(c.n===0?'Prologo':'Capitolo '+c.n))+'</span>'+
       (c.pov?'<span>Punto di vista: <b>'+esc(c.pov)+'</b></span>':'')+
       (c.luogo?'<span>Luogo: '+esc(c.luogo)+'</span>':'')+
       (c.pagina?'<span>Pagina: '+esc(c.pagina)+'</span>':'')+'</div>';
    if(c.breve) h+='<p class="breve">'+esc(c.breve)+'</p>';
    h+='<div class="sinossi">'+(c.sinossi||[]).map(function(p){return '<p>'+esc(p)+'</p>';}).join("")+'</div>';
    if(c.note) h+='<div class="nota"><b>Da tenere a mente.</b> '+esc(c.note)+'</div>';
    CAMPI.forEach(function(k){ h+=chipGruppo(k[1], c[k[0]]); });
    var f=saga().fonte;
    h+='<div class="fonte">Fonte: <a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.nome)+'</a> ('+esc(f.licenza)+'). Sinossi tradotta e rielaborata in italiano.</div>';
    return h;
  }
  function pannelloCapitoli(){
    var b=libro(), c = b.capitoli.filter(function(x){return x.n===st.cap;})[0];
    if(!c || !visibile(b,c)){
      var vis=b.capitoli.filter(function(x){return visibile(b,x);});
      if(!vis.length) return '<div class="vuoto">Nessun capitolo visibile. Con la modalità anti-spoiler attiva, scegli «Letto fino a» in alto.</div>';
      return '<h2 class="cap">'+esc(b.titolo)+'</h2><div class="meta"><span>'+esc(b.titoloEn)+' · '+esc(saga().autore)+' · '+b.anno+'</span></div>'+
        '<div class="azioni no-stampa"><button class="btn" data-az="stampa-libro">🖨️ Stampa il libro (capitoli visibili)</button></div>'+
        '<p>Scegli un capitolo dall\'elenco. Capitoli inseriti: <b>'+b.capitoli.length+'</b> su '+b.totaleCapitoli+'.</p>'+
        '<ul class="elenco-cap">'+vis.map(function(x){return '<li><a href="#" data-cap="'+x.n+'"><b>'+esc(x.titolo)+'</b></a> — '+esc(x.breve||"")+'</li>';}).join("")+'</ul>';
    }
    return htmlCapitolo(b,c,true);
  }

  /* ---------- vista database ---------- */
  function listaFiltri(){
    var vis=entitaVisibili(), cont={};
    vis.forEach(function(e){cont[e.tipo]=(cont[e.tipo]||0)+1;});
    var h='<div class="nota-aside"><b>Tipo di voce</b></div>';
    h+='<button class="voce '+(st.tipo==="tutti"?'sel':'')+'" data-tipo="tutti"><span class="t">Tutte</span> <span class="p">('+vis.length+')</span></button>';
    Object.keys(TIPI).forEach(function(t){
      if(!cont[t]) return;
      h+='<button class="voce '+(st.tipo===t?'sel':'')+'" data-tipo="'+t+'"><span class="t">'+TIPI[t]+'</span> <span class="p">('+cont[t]+')</span></button>';
    });
    return h;
  }
  function pannelloDatabase(){
    if(st.ent){ var e=entita(st.ent); if(e) return schedaEntita(e); }
    var vis=entitaVisibili(), q=norm(st.q);
    vis = vis.filter(function(e){
      if(st.tipo!=="tutti" && e.tipo!==st.tipo) return false;
      if(q && norm(e.nome+" "+(e.en||"")+" "+(e.alias||[]).join(" ")+" "+(e.descr||"")).indexOf(q)<0) return false;
      return true;
    }).sort(function(a,b){return a.nome.localeCompare(b.nome,"it");});
    var h='<h2 class="cap">Database — '+esc(saga().nome)+'</h2><div class="meta"><span>'+vis.length+' voci</span>'+(st.anti?'<span>Solo voci già incontrate nei capitoli letti</span>':'')+'</div>';
    if(!vis.length) return h+'<div class="vuoto">Nessuna voce trovata.</div>';
    h+='<div class="griglia">'+vis.map(function(e){
      return '<div class="scheda" data-ent="'+esc(e.id)+'"><div class="tp">'+TIPI_SING[e.tipo]+'</div><div class="nm">'+esc(e.nome)+'</div><div class="en">'+esc(e.en||"")+'</div></div>';
    }).join("")+'</div>';
    return h;
  }
  function schedaEntita(e){
    var ap=apparizioni(e.id);
    var h='<div class="azioni no-stampa"><button class="btn" data-az="indietro">← Torna all\'elenco</button><button class="btn" data-az="stampa">🖨️ Stampa questa scheda</button></div>';
    h+='<div class="meta"><span>'+TIPI_SING[e.tipo]+'</span></div><h2 class="cap">'+esc(e.nome)+'</h2>';
    if(e.en) h+='<div class="meta"><span>'+esc(e.en)+'</span>'+(e.alias&&e.alias.length?'<span>Detto anche: '+esc(e.alias.join(", "))+'</span>':'')+'</div>';
    h+='<p>'+esc(e.descr||"")+'</p>';
    h+='<div class="azioni no-stampa">'+
       (linkWiki(e)?'<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(linkWiki(e))+'">Pagina sul wiki ↗</a>':'')+
       '<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(linkCerca(e))+'">Cerca sul wiki ↗</a></div>';
    h+='<div class="gruppo"><h3>Compare in</h3>';
    if(!ap.length) h+='<div class="vuoto">Non ancora nei capitoli inseriti.</div>';
    else h+='<ul class="elenco-cap">'+ap.map(function(a){return '<li><a href="#" data-lib="'+esc(a.libro.id)+'" data-cap="'+a.cap.n+'"><b>'+esc(a.libro.titolo)+' — '+esc(a.cap.titolo)+'</b></a> <span style="color:var(--tenue);font-family:var(--sans);font-size:.8rem">('+esc(a.ruoli.join(", ").toLowerCase())+')</span></li>';}).join("")+'</ul>';
    h+='</div>';
    h+='<div class="fonte">Scheda sintetica, senza anticipazioni oltre i capitoli inseriti. Dettagli completi sul wiki: <a href="'+esc(saga().fonte.url)+'" target="_blank" rel="noopener">'+esc(saga().fonte.nome)+'</a>.</div>';
    return h;
  }

  /* ---------- vista info ---------- */
  function pannelloInfo(){
    var s=saga(), f=s.fonte;
    var h='<h2 class="cap">Info e fonti</h2>';
    h+='<p>Archivio personale di riassunti capitolo per capitolo e di schede (personaggi, luoghi, casate, popoli, termini, epoche), con collegamenti incrociati tra capitoli e voci.</p>';
    h+='<div class="gruppo"><h3>Saga corrente</h3><p><b>'+esc(s.nome)+'</b> ('+esc(s.nomeEn)+') — '+esc(s.autore)+'<br>Fonte principale: <a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.nome)+'</a>. Licenza: '+esc(f.licenza)+'.</p></div>';
    h+='<div class="gruppo"><h3>Libri nell\'archivio</h3><ul class="elenco-cap">'+s.libri.map(function(b){return '<li><b>'+esc(b.titolo)+'</b> ('+esc(b.titoloEn)+', '+b.anno+') — '+b.capitoli.length+' capitoli inseriti su '+b.totaleCapitoli+'</li>';}).join("")+'</ul></div>';
    h+='<div class="gruppo"><h3>Come si usa</h3><ul class="elenco-cap"><li>Scegli saga e libro in alto, poi un capitolo a sinistra.</li><li>Tocca un nome nei gruppi sotto il riassunto per aprire la scheda.</li><li>Con «Modalità anti-spoiler» vedi solo i capitoli fino a quello che hai letto, e solo le voci già incontrate.</li><li>«Stampa» produce una pagina pulita; da lì puoi salvare in PDF.</li></ul></div>';
    h+='<div class="fonte">Le sinossi sono traduzioni e rielaborazioni in italiano di testi del wiki citato e sono distribuite con la stessa licenza. Il testo dei romanzi non è riprodotto. Il file contiene solo riassunti: i tuoi progressi di lettura sono salvati nel browser di questo dispositivo.</div>';
    return h;
  }

  /* ---------- disegno ---------- */
  function disegna(){
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.getAttribute("data-vista")===st.vista); });
    var lat=document.getElementById("laterale"), pan=document.getElementById("pannello");
    aggiornaLetto();
    if(st.vista==="capitoli"){ lat.style.display=""; lat.innerHTML=listaCapitoli(); pan.innerHTML=pannelloCapitoli(); }
    else if(st.vista==="database"){ lat.style.display=""; lat.innerHTML=listaFiltri(); pan.innerHTML=pannelloDatabase(); }
    else { lat.style.display="none"; pan.innerHTML=pannelloInfo(); }
    document.querySelector("main").style.gridTemplateColumns = (st.vista==="info") ? "1fr" : "";
  }

  /* ---------- stampa ---------- */
  function stampaLibro(){
    var b=libro(), area=document.getElementById("areaStampa");
    var h='<h1 style="font-size:1.8rem;margin:0 0 4px">'+esc(b.titolo)+'</h1><div class="meta"><span>'+esc(b.titoloEn)+' · '+esc(saga().autore)+' · '+b.anno+'</span></div>';
    b.capitoli.filter(function(c){return visibile(b,c);}).forEach(function(c){ h+='<div class="capitolo-stampa">'+htmlCapitolo(b,c,false)+'</div>'; });
    area.innerHTML=h;
    document.body.classList.add("stampa-libro");
    var fine=function(){ document.body.classList.remove("stampa-libro"); area.innerHTML=""; window.removeEventListener("afterprint",fine); };
    window.addEventListener("afterprint",fine);
    setTimeout(function(){ window.print(); },60);
  }

  /* ---------- eventi ---------- */
  document.addEventListener("click",function(ev){
    var t=ev.target;
    var tab=t.closest(".tab");
    if(tab){ st.vista=tab.getAttribute("data-vista"); st.ent=null; disegna(); return; }
    var az=t.closest("[data-az]");
    if(az){
      var a=az.getAttribute("data-az");
      if(a==="stampa") window.print();
      else if(a==="stampa-libro") stampaLibro();
      else if(a==="indietro"){ st.ent=null; disegna(); }
      return;
    }
    var ent=t.closest("[data-ent]");
    if(ent){ st.vista="database"; st.ent=ent.getAttribute("data-ent"); disegna(); window.scrollTo(0,0); return; }
    var tp=t.closest("[data-tipo]");
    if(tp){ st.tipo=tp.getAttribute("data-tipo"); st.ent=null; disegna(); return; }
    var cp=t.closest("[data-cap]");
    if(cp && !cp.disabled){
      ev.preventDefault();
      var lib=cp.getAttribute("data-lib");
      if(lib){ var i=saga().libri.map(function(b){return b.id;}).indexOf(lib); if(i>=0){ st.libro=i; document.getElementById("selLibro").value=i; } }
      st.vista="capitoli"; st.cap=parseInt(cp.getAttribute("data-cap"),10); disegna(); window.scrollTo(0,0); return;
    }
  });
  document.getElementById("selSaga").addEventListener("change",function(e){ st.saga=+e.target.value; st.libro=0; st.cap=null; st.ent=null; aggiornaSelLibro(); salva(); disegna(); });
  document.getElementById("selLibro").addEventListener("change",function(e){ st.libro=+e.target.value; st.cap=null; salva(); disegna(); });
  document.getElementById("cerca").addEventListener("input",function(e){ st.q=e.target.value; st.ent=null; disegna(); });
  document.getElementById("chkAnti").addEventListener("change",function(e){ st.anti=e.target.checked; salva(); disegna(); });
  document.getElementById("selLetto").addEventListener("change",function(e){ st.letto[saga().id+"/"+libro().id]=parseInt(e.target.value,10); salva(); disegna(); });
  document.getElementById("btnTema").addEventListener("click",function(){ st.tema = st.tema==="scuro"?"chiaro":"scuro"; document.documentElement.setAttribute("data-tema", st.tema); salva(); });

  /* ---------- avvio ---------- */
  if(!DATA.length){ document.getElementById("pannello").innerHTML='<div class="vuoto">Nessun dato trovato: controlla che la cartella «dati» sia accanto a index.html.</div>'; return; }
  carica(); iniziaIntestazione();
  var b0=libro(); if(b0.capitoli.length) st.cap=null;
  disegna();
})();
</script>
</body>
</html>
