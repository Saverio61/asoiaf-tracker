<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Song of Ice and Fire — Archivio Cronologico & Lore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Lora', serif;
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #161b22; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #c69b3f; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s ease;
      border-width: 1px;
    }
    .tag-badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0d1117] text-[#e6edf3]">

  <!-- Intestazione -->
  <header class="border-b border-[#30363d] bg-[#161b22] sticky top-0 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <span class="text-2xl text-[#d29922]">⚔️</span>
        <div>
          <h1 class="font-cinzel text-xl md:text-2xl font-bold tracking-wider text-[#d29922] uppercase">A Song of Ice and Fire</h1>
          <p class="text-[10px] font-cinzel text-[#8b949e] uppercase tracking-widest font-semibold">Registro Cronologico & Lore Tracker</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2 flex-wrap text-xs font-cinzel">
        <button id="btn-export-json" class="px-3 py-1.5 rounded bg-[#21262d] border border-[#30363d] hover:border-[#d29922] text-[#c9d1d9] font-bold transition">
          📥 Backup JSON
        </button>
        <button id="btn-export-csv" class="px-3 py-1.5 rounded bg-[#21262d] border border-[#30363d] hover:border-[#d29922] text-[#c9d1d9] font-bold transition">
          📊 Esporta CSV
        </button>
        <label class="px-3 py-1.5 rounded bg-[#21262d] border border-[#30363d] hover:border-[#d29922] text-[#c9d1d9] font-bold transition cursor-pointer">
          📤 Importa JSON
          <input type="file" id="input-import-json" accept=".json" class="hidden">
        </label>
        <button id="btn-open-modal" class="px-4 py-1.5 rounded bg-[#8b1e1e] border border-[#f85149] hover:bg-[#a42828] text-white font-bold uppercase tracking-wider transition">
          + Aggiungi Capitolo
        </button>
      </div>
    </div>
  </header>

  <!-- Area Principale -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- Filtri e Navigazione -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-[#30363d]">
      <div class="flex space-x-2">
        <button id="tab-chapters" class="px-4 py-2 font-cinzel text-xs tracking-wider uppercase border-b-2 border-[#d29922] font-bold text-[#d29922] bg-[#161b22] rounded-t">
          📖 Cronologia Capitoli
        </button>
        <button id="tab-entities" class="px-4 py-2 font-cinzel text-xs tracking-wider uppercase border-b-2 border-transparent text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#161b22]/50 rounded-t transition">
          🏛️ Registro Generale Entità
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <input type="text" id="filter-search" placeholder="Cerca personaggi, luoghi, note..." 
          class="px-3 py-1.5 bg-[#161b22] border border-[#30363d] rounded text-sm w-full md:w-60 text-[#c9d1d9] placeholder-[#8b949e] focus:outline-none focus:border-[#d29922]">
        
        <select id="filter-book" class="px-2.5 py-1.5 bg-[#161b22] border border-[#30363d] rounded text-xs font-cinzel font-semibold text-[#c9d1d9] focus:outline-none focus:border-[#d29922]">
          <option value="all">Tutti i Libri</option>
          <option value="A Game of Thrones">A Game of Thrones</option>
          <option value="A Clash of Kings">A Clash of Kings</option>
          <option value="A Storm of Swords">A Storm of Swords</option>
          <option value="A Feast for Crows">A Feast for Crows</option>
          <option value="A Dance with Dragons">A Dance with Dragons</option>
        </select>

        <select id="filter-pov" class="px-2.5 py-1.5 bg-[#161b22] border border-[#30363d] rounded text-xs font-cinzel font-semibold text-[#c9d1d9] focus:outline-none focus:border-[#d29922]">
          <option value="all">Tutti i POV</option>
        </select>
      </div>
    </div>

    <!-- SEZIONE CAPITOLI -->
    <div id="view-chapters" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Lista Laterale -->
      <div class="lg:col-span-4 bg-[#161b22] border border-[#30363d] rounded-xl p-3 shadow-lg flex flex-col h-[750px]">
        <div class="text-[11px] font-cinzel tracking-wider uppercase text-[#8b949e] mb-2 px-2 font-bold flex justify-between border-b border-[#30363d] pb-2">
          <span>Elenco Capitoli</span>
          <span id="chapter-count" class="bg-[#21262d] border border-[#30363d] px-2 py-0.5 rounded text-[#d29922] font-bold">0</span>
        </div>
        <div id="chapters-list" class="space-y-2 overflow-y-auto custom-scroll flex-1 pr-1"></div>
      </div>

      <!-- Dettaglio Completo -->
      <div class="lg:col-span-8 bg-[#161b22] border border-[#30363d] rounded-xl p-6 shadow-lg overflow-y-auto custom-scroll h-[750px]" id="chapter-detail">
        <div class="text-center py-28 text-[#8b949e] italic">Seleziona un capitolo dalla colonna di sinistra.</div>
      </div>

    </div>

    <!-- SEZIONE ENCICLOPEDIA ENTITÀ -->
    <div id="view-entities" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
        
        <div class="bg-[#161b22] p-4 border border-[#30363d] rounded-xl shadow-md">
          <h3 class="font-cinzel text-xs tracking-wider uppercase font-bold text-[#ff7b72] mb-3 flex items-center justify-between border-b border-[#30363d] pb-2">
            <span>Personaggi</span>
            <span id="count-chars" class="bg-[#3c1418] border border-[#7d1a1a] text-[#ff7b72] px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-chars" class="space-y-2 max-h-[580px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <div class="bg-[#161b22] p-4 border border-[#30363d] rounded-xl shadow-md">
          <h3 class="font-cinzel text-xs tracking-wider uppercase font-bold text-[#79c0ff] mb-3 flex items-center justify-between border-b border-[#30363d] pb-2">
            <span>Luoghi & Città</span>
            <span id="count-places" class="bg-[#102a45] border border-[#1f4a75] text-[#79c0ff] px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-places" class="space-y-2 max-h-[580px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <div class="bg-[#161b22] p-4 border border-[#30363d] rounded-xl shadow-md">
          <h3 class="font-cinzel text-xs tracking-wider uppercase font-bold text-[#d29922] mb-3 flex items-center justify-between border-b border-[#30363d] pb-2">
            <span>Casate Nobili</span>
            <span id="count-houses" class="bg-[#3e2b0a] border border-[#6e4d0d] text-[#d29922] px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-houses" class="space-y-2 max-h-[580px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <div class="bg-[#161b22] p-4 border border-[#30363d] rounded-xl shadow-md">
          <h3 class="font-cinzel text-xs tracking-wider uppercase font-bold text-[#7ee787] mb-3 flex items-center justify-between border-b border-[#30363d] pb-2">
            <span>Popoli & Fazioni</span>
            <span id="count-races" class="bg-[#13321d] border border-[#235833] text-[#7ee787] px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-races" class="space-y-2 max-h-[580px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <div class="bg-[#161b22] p-4 border border-[#30363d] rounded-xl shadow-md">
          <h3 class="font-cinzel text-xs tracking-wider uppercase font-bold text-[#d2a8ff] mb-3 flex items-center justify-between border-b border-[#30363d] pb-2">
            <span>Termini & Oggetti</span>
            <span id="count-terms" class="bg-[#311d4d] border border-[#552f87] text-[#d2a8ff] px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-terms" class="space-y-2 max-h-[580px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

      </div>
    </div>
  </main>

  <!-- Modale Aggiungi Capitolo -->
  <div id="modal-new-chapter" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#161b22] border border-[#30363d] rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-[#30363d] flex justify-between items-center bg-[#21262d]">
        <h3 class="font-cinzel text-sm tracking-wider uppercase font-bold text-[#d29922]">Aggiungi Capitolo al Database</h3>
        <button id="btn-close-modal" class="text-[#8b949e] hover:text-white text-2xl font-bold">&times;</button>
      </div>

      <form id="form-chapter" class="p-5 overflow-y-auto custom-scroll space-y-4 text-xs font-semibold">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block uppercase tracking-wider text-[#8b949e] mb-1">Titolo Capitolo</label>
            <input type="text" id="inp-title" required placeholder="es. Catelyn I" class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#8b949e] mb-1">Libro</label>
            <select id="inp-book" class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
              <option value="A Game of Thrones">A Game of Thrones</option>
              <option value="A Clash of Kings">A Clash of Kings</option>
              <option value="A Storm of Swords">A Storm of Swords</option>
              <option value="A Feast for Crows">A Feast for Crows</option>
              <option value="A Dance with Dragons">A Dance with Dragons</option>
            </select>
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#8b949e] mb-1">Punto di Vista (P.O.V.)</label>
            <input type="text" id="inp-pov" required placeholder="es. Catelyn" class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#8b949e] mb-1">Luogo Principale</label>
            <input type="text" id="inp-place" required placeholder="es. Winterfell" class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
        </div>

        <div>
          <label class="block uppercase tracking-wider text-[#8b949e] mb-1">Sinossi Funzionale</label>
          <textarea id="inp-synopsis" rows="4" required class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9] leading-relaxed"></textarea>
        </div>

        <div class="border-t border-[#30363d] pt-3 space-y-3">
          <div>
            <label class="block uppercase tracking-wider text-[#ff7b72] mb-1">Personaggi Presenti (separati da virgola)</label>
            <input type="text" id="inp-chars" placeholder="Catelyn Stark, Eddard Stark..." class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#ff7b72] mb-1">Personaggi Menzionati</label>
            <input type="text" id="inp-mentioned" placeholder="Robert Baratheon, Jon Arryn..." class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#79c0ff] mb-1">Luoghi Citati</label>
            <input type="text" id="inp-places-list" placeholder="King's Landing, The Eyrie..." class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#d29922] mb-1">Casate Nobili</label>
            <input type="text" id="inp-houses" placeholder="House Tully, House Stark..." class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#7ee787] mb-1">Popoli, Razze & Fazioni</label>
            <input type="text" id="inp-races" placeholder="First Men, Night's Watch..." class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#d2a8ff] mb-1">Termini & Oggetti</label>
            <input type="text" id="inp-terms" placeholder="Heart tree, Hand of the King..." class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-[#8b949e] mb-1">Note & Foreshadowing</label>
            <textarea id="inp-notes" rows="2" class="w-full px-3 py-2 bg-[#0d1117] border border-[#30363d] rounded text-[#c9d1d9]"></textarea>
          </div>
        </div>

        <div class="pt-3 border-t border-[#30363d] flex justify-end gap-2">
          <button type="button" id="btn-cancel-modal" class="px-4 py-1.5 border border-[#30363d] rounded text-[#8b949e] hover:text-white">Annulla</button>
          <button type="submit" class="px-5 py-1.5 bg-[#8b1e1e] border border-[#f85149] text-white rounded font-bold uppercase tracking-wider hover:bg-[#a42828]">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Tabella Canonica per link AWOIAF diretti senza errori
    const CANON_MAPPING = {
      'casa stark': 'House_Stark',
      'casa royce': 'House_Royce',
      'casa mallister': 'House_Mallister',
      'casa greyjoy': 'House_Greyjoy',
      'casa cassel': 'House_Cassel',
      'casa baratheon': 'House_Baratheon',
      'casa targaryen': 'House_Targaryen',
      'casa arryn': 'House_Arryn',
      'casa tully': 'House_Tully',
      'casa lannister': 'House_Lannister',
      'grande inverno': 'Winterfell',
      'la barriera': 'The_Wall',
      'oltre la barriera': 'Beyond_the_Wall',
      'bosco stregato': 'Haunted_Forest',
      'castello nero': 'Castle_Black',
      'approdo del re': "King's_Landing",
      'isole di ferro': 'Iron_Islands',
      'pyke': 'Pyke_(castle)',
      'valyria': 'Valyria',
      'gli estranei': 'Others',
      'estranei': 'Others',
      'guardiani della notte': "Night's_Watch",
      'popolo libero': 'Free_Folk',
      'bruti': 'Free_Folk',
      'non-morti': 'Wights',
      'primi uomini': 'First_Men',
      'metalupi': 'Direwolf',
      'metalupo': 'Direwolf',
      'ghiaccio': 'Ice_(sword)',
      'acciaio di valyria': 'Valyrian_steel',
      'albero sentinella': 'Sentinel_tree',
      'legnoferro': 'Ironwood',
      'confratello giurato': "Night's_Watch#Organization"
    };

    function getWikiUrl(entityName) {
      if (!entityName) return '#';
      let clean = entityName.split('(')[0].trim();
      const lower = clean.toLowerCase();

      if (CANON_MAPPING[lower]) {
        return `https://awoiaf.westeros.org/index.php/${CANON_MAPPING[lower]}`;
      }
      if (lower.startsWith('casa ')) {
        const houseName = clean.substring(5).trim();
        return `https://awoiaf.westeros.org/index.php/House_${encodeURIComponent(houseName)}`;
      }
      return `https://awoiaf.westeros.org/index.php?search=${encodeURIComponent(clean)}&title=Special%3ASearch&go=Go`;
    }

    function makeBadge(name, type) {
      const url = getWikiUrl(name);
      let styles = '';
      if (type === 'char')  styles = 'bg-[#3c1418] border-[#7d1a1a] text-[#ff7b72] hover:bg-[#581c21] hover:text-white';
      if (type === 'place') styles = 'bg-[#102a45] border-[#1f4a75] text-[#79c0ff] hover:bg-[#163a61] hover:text-white';
      if (type === 'house') styles = 'bg-[#3e2b0a] border-[#6e4d0d] text-[#d29922] hover:bg-[#52390e] hover:text-white';
      if (type === 'race')  styles = 'bg-[#13321d] border-[#235833] text-[#7ee787] hover:bg-[#1c4729] hover:text-white';
      if (type === 'item')  styles = 'bg-[#311d4d] border-[#552f87] text-[#d2a8ff] hover:bg-[#432769] hover:text-white';

      return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="tag-badge ${styles}" title="Apri su A Wiki of Ice and Fire">
        <span>${name}</span>
        <span class="text-[10px] opacity-70">↗</span>
      </a>`;
    }

      {

        book: "A Game of Thrones",
        pov: "Will",
        place: "Beyond the Wall",
        chronology: "Prologo → Bran I (Fine 297 CA)",
        synopsis: "Tre ranger dei Guardiani della Notte — Ser Waymar Royce, Will e il veterano Gared — sono sulle tracce di un gruppo di razziatori bruti nel Bosco Stregato, a 9 giorni di marcia a nord della Barriera. Will trova il loro accampamento: non ci sono fuochi e gli otto bruti giacciono immobili nella neve senza tracce di sangue. Gared insiste per ritirarsi verso la Barriera temendo una tempesta e un freddo innaturale, ma Royce, diciottenne aristocratico alla sua prima spedizione, ordina di avanzare.\n\nLasciato Gared a guardia dei cavalli senza fuoco, Will e Royce risalgono il costone roccioso: i cadaveri sono svaniti nel nulla. Un Estraneo emerge dalle ombre e ingaggia un duello con Royce; la spada d'acciaio umano del nobile esplode in mille schegge a contatto con la lama di cristallo dell'Estraneo. Royce viene massacrato. Quando Will scende dall'albero sentinella per raccogliere la spada spezzata come prova per i comandanti, il cadavere di Waymar si ridesta con occhi blu zaffiro e lo strangola con mani gelide.",
        characters: [

        ],
        mentioned: ["Aemon", "Robert I Baratheon", "Jeor Mormont"],
        places: ["Beyond the Wall", "Haunted Forest", "Castle Black", "The Wall", "Westeros"],
        houses: ["House Royce", "House Mallister"],
        races: ["Others", "Night's Watch", "Free Folk", "Wights"],
        terms: ["Crystal sword", "Sentinel tree", "Ironwood", "Sworn Brother"],
        notes: "• Apertura con l'orrore cosmico e sovrannaturale prima dell'introduzione dei conflitti politici umani.\n• Gared fugge in preda al terrore verso sud: la sua cattura e decapitazione per diserzione darà inizio a Bran I.\n• L'acciaio ordinario non resiste al gelo estremo delle armi degli Estranei e si scheggia istantaneamente."
      },
      {
        id: "agot-chapter-1",
        title: "Capitolo 1 (Bran I)",
        book: "A Game of Thrones",
        pov: "Bran",
        place: "Winterfell",
        chronology: "Bran I → Catelyn I (298 CA)",
        synopsis: "Bran Stark, a sette anni, cavalca per la prima volta con il padre Lord Eddard Stark, i fratelli Robb e Jon, e Theon Greyjoy per assistere a un'esecuzione. Il condannato è Gared, il ranger superstite del massacro del Prologo. Gared appare emaciato e muto di terrore. Lord Eddard sguaina la spada ancestrale Ghiaccio (Ice), uno spadone in acciaio di Valyria largo quattro dita, e decapita il disertore con un colpo netto. Ned spiega a Bran che chi pronuncia la sentenza deve essere colui che cala la spada per comprendere il peso morale della morte.\n\nSulla strada del ritorno, il gruppo scopre una femmina gigantesca di metalupo (Direwolf) morta con un pezzo di corno di cervo conficcato nella gola, circondata da cinque cuccioli appena nati. Jon Snow convince Ned a non sopprimerli, facendo notare che il metalupo è il simbolo araldico degli Stark e che ci sono cinque cuccioli (tre maschi e due femmine) per i cinque figli legittimi di Eddard. Poco dopo, Jon si imbatte in un sesto cucciolo, albino dagli occhi rossi, allontanatosi dagli altri prima della morte della madre: Bran nota che quel cucciolo spetta a Jon.",

          { name: "Jon Snow", role: "Figlio bastardo quattordicenne di Ned Stark.", status: "In vita" },
          { name: "Theon Greyjoy", role: "Erede di Pyke, pupillo e ostaggio di Ned, 19 anni.", status: "In vita" },
          { name: "Gared", role: "Disertore dei Guardiani della Notte superstite del Prologo.", status: "Deceduto (decapitato da Eddard Stark)" },
          { name: "Jory Cassel", role: "Capitano della guardia di Grande Inverno.", status: "In vita" },
          { name: "Hullen", role: "Mastro dei cavalli di Grande Inverno.", status: "In vita" },
          { name: "Harwin", role: "Guardia di Grande Inverno, figlio di Hullen.", status: "In vita" },
          { name: "Direwolf", role: "5 cuccioli per i figli legittimi + 1 albino dagli occhi rossi (Ghost).", status: "In vita" }
        ],
        mentioned: ["Mance Rayder", "Robert I Baratheon", "Catelyn Stark", "Sansa Stark", "Arya Stark", "Rickon Stark"],
        places: ["Winterfell", "The Wall", "Iron Islands", "Pyke", "Valyria", "King's Landing"],
        houses: ["House Stark", "House Greyjoy", "House Cassel", "House Baratheon", "House Targaryen"],
        races: ["First Men", "Night's Watch", "Free Folk", "Direwolf"],
        terms: ["Ice", "Valyrian steel", "Ironwood", "Warden of the North", "Greatsword"],
        notes: "• La lupa uccisa dal corno del cervo prefigura il destino tragico di Casa Stark provocato da Casa Baratheon.\n• Ned presume che Gared sia impazzito per paura dei bruti, ignorando il risveglio degli Estranei.\n• Il sesto cucciolo albino, muto e appartato, simboleggia l'isolamento e il destino di Jon Snow."
      }
    ];

    let chapters = JSON.parse(localStorage.getItem('asoiaf_tracker_stable_v1')) || INITIAL_CHAPTERS;
    let selectedChapterId = chapters[0]?.id || null;

    function saveState() {
      localStorage.setItem('asoiaf_tracker_stable_v1', JSON.stringify(chapters));
    }

    function renderChaptersList() {
      const container = document.getElementById('chapters-list');
      const bookFilter = document.getElementById('filter-book').value;
      const povFilter = document.getElementById('filter-pov').value;
      const searchFilter = document.getElementById('filter-search').value.toLowerCase();

      const filtered = chapters.filter(c => {
        const matchesBook = (bookFilter === 'all' || c.book === bookFilter);
        const matchesPov = (povFilter === 'all' || c.pov === povFilter);
        const matchesSearch = !searchFilter || 
          c.title.toLowerCase().includes(searchFilter) ||
          c.synopsis.toLowerCase().includes(searchFilter) ||
          c.characters.some(ch => ch.name.toLowerCase().includes(searchFilter)) ||
          c.places.some(p => p.toLowerCase().includes(searchFilter));
        return matchesBook && matchesPov && matchesSearch;
      });

      document.getElementById('chapter-count').textContent = `${filtered.length} di ${chapters.length}`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-xs text-[#8b949e] italic p-3 text-center">Nessun capitolo trovato.</p>';
        return;
      }

      filtered.forEach(c => {
        const isSelected = (c.id === selectedChapterId);
        const card = document.createElement('div');
        card.className = `p-3 rounded-lg border transition-all cursor-pointer ${
          isSelected 
            ? 'bg-[#21262d] border-[#d29922] shadow-md' 
            : 'bg-[#161b22] hover:bg-[#21262d]/60 border-[#30363d]'
        }`;
        card.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <h4 class="font-cinzel font-bold text-sm text-[#e6edf3]">${c.title}</h4>
            <span class="text-[10px] font-cinzel px-1.5 py-0.5 rounded bg-[#3c1418] border border-[#7d1a1a] text-[#ff7b72] font-bold">${c.pov}</span>
          </div>
          <p class="text-xs text-[#79c0ff] truncate">${c.place}</p>
          <p class="text-[10px] text-[#8b949e] font-cinzel mt-1 tracking-wider uppercase">${c.book}</p>
        `;
        card.onclick = () => {
          selectedChapterId = c.id;
          renderChaptersList();
          renderChapterDetail();
        };
        container.appendChild(card);
      });
    }

    function renderChapterDetail() {
      const container = document.getElementById('chapter-detail');
      const c = chapters.find(item => item.id === selectedChapterId);

      if (!c) {
        container.innerHTML = '<div class="text-center py-28 text-[#8b949e] italic">Seleziona un capitolo.</div>';
        return;
      }

      container.innerHTML = `
        <div class="space-y-6">
          <div class="border-b border-[#30363d] pb-4">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
              <span class="text-xs font-cinzel tracking-widest uppercase text-[#d29922] font-bold">${c.book}</span>
              <span class="text-[11px] font-cinzel bg-[#21262d] border border-[#30363d] px-2.5 py-1 rounded text-[#8b949e]">${c.chronology || 'In sequenza'}</span>
            </div>
            <h2 class="font-cinzel text-2xl md:text-3xl font-bold text-[#e6edf3] tracking-wide">${c.title}</h2>
            <div class="flex flex-wrap gap-4 mt-2 text-xs font-semibold text-[#8b949e]">
              <span>P.O.V.: <strong class="text-[#ff7b72] font-cinzel font-bold">${c.pov}</strong></span>
              <span>•</span>
              <span>Luogo: <a href="${getWikiUrl(c.place)}" target="_blank" class="text-[#79c0ff] hover:underline font-semibold">${c.place} ↗</a></span>
            </div>
          </div>

          <!-- Sinossi -->
          <div>
            <h4 class="font-cinzel text-xs tracking-wider uppercase font-bold text-[#d29922] mb-2">Sinossi Funzionale</h4>
            <div class="text-sm leading-relaxed bg-[#0d1117] p-4 rounded-lg border border-[#30363d] text-[#c9d1d9] space-y-3 font-normal">
              ${c.synopsis.split('\n\n').map(p => `<p>${p}</p>`).join('')}
            </div>
          </div>

          <!-- Personaggi Presenti -->
          <div>
            <h4 class="font-cinzel text-xs tracking-wider uppercase font-bold text-[#d29922] mb-3">Personaggi Presenti (${c.characters.length})</h4>
            <div class="overflow-x-auto rounded-lg border border-[#30363d]">
              <table class="w-full text-left text-xs border-collapse bg-[#0d1117]">
                <thead>
                  <tr class="bg-[#21262d] border-b border-[#30363d] font-cinzel text-[11px] text-[#8b949e] uppercase">
                    <th class="p-3">Nome (AWOIAF)</th>
                    <th class="p-3">Ruolo / Profilo</th>
                    <th class="p-3">Stato</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#30363d]">
                  ${c.characters.map(ch => `
                    <tr class="hover:bg-[#161b22] transition">
                      <td class="p-3 font-bold">
                        <a href="${getWikiUrl(ch.name)}" target="_blank" class="text-[#ff7b72] hover:underline inline-flex items-center gap-1 font-semibold">
                          ${ch.name} <span class="text-[10px] opacity-70">↗</span>
                        </a>
                      </td>
                      <td class="p-3 text-[#c9d1d9]">${ch.role}</td>
                      <td class="p-3 italic text-[#8b949e] font-medium">${ch.status}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Liste Entità -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <div class="bg-[#0d1117] p-3.5 rounded-lg border border-[#30363d]">
              <h5 class="font-cinzel text-[11px] uppercase tracking-wider font-bold text-[#ff7b72] mb-2">Personaggi Menzionati</h5>
              <div class="flex flex-wrap gap-1.5">
                ${c.mentioned.map(m => makeBadge(m, 'char')).join('')}
              </div>
            </div>

            <div class="bg-[#0d1117] p-3.5 rounded-lg border border-[#30363d]">
              <h5 class="font-cinzel text-[11px] uppercase tracking-wider font-bold text-[#79c0ff] mb-2">Luoghi & Città Citati</h5>
              <div class="flex flex-wrap gap-1.5">
                ${c.places.map(p => makeBadge(p, 'place')).join('')}
              </div>
            </div>

            <div class="bg-[#0d1117] p-3.5 rounded-lg border border-[#30363d]">
              <h5 class="font-cinzel text-[11px] uppercase tracking-wider font-bold text-[#d29922] mb-2">Casate Nobili</h5>
              <div class="flex flex-wrap gap-1.5">
                ${c.houses.map(h => makeBadge(h, 'house')).join('')}
              </div>
            </div>

            <div class="bg-[#0d1117] p-3.5 rounded-lg border border-[#30363d]">
              <h5 class="font-cinzel text-[11px] uppercase tracking-wider font-bold text-[#7ee787] mb-2">Popoli & Fazioni</h5>
              <div class="flex flex-wrap gap-1.5">
                ${(c.races || []).map(r => makeBadge(r, 'race')).join('')}
              </div>
            </div>

          </div>

          <!-- Termini & Oggetti -->
          <div class="bg-[#0d1117] p-3.5 rounded-lg border border-[#30363d]">
            <h5 class="font-cinzel text-[11px] uppercase tracking-wider font-bold text-[#d2a8ff] mb-2">Termini & Oggetti di Lore</h5>
            <div class="flex flex-wrap gap-1.5">
              ${c.terms.map(t => makeBadge(t, 'item')).join('')}
            </div>
          </div>

          <!-- Note Critiche -->
          ${c.notes ? `
            <div>
              <h4 class="font-cinzel text-xs tracking-wider uppercase font-bold text-[#d29922] mb-2">Note Critiche & Presagi</h4>
              <div class="text-xs bg-[#21262d] p-4 rounded-lg border border-[#30363d] space-y-1.5 text-[#e6edf3] leading-relaxed">
                ${c.notes.split('\n').map(n => `<p>${n}</p>`).join('')}
              </div>
            </div>
          ` : ''}

          <div class="pt-4 border-t border-[#30363d] flex justify-end">
            <button onclick="deleteChapter('${c.id}')" class="text-xs text-[#ff7b72] hover:underline">Elimina questo capitolo</button>
          </div>
        </div>
      `;
    }

    function renderEntities() {
      const chars = new Map();
      const places = new Set();
      const houses = new Set();
      const races = new Set();
      const terms = new Set();

      chapters.forEach(c => {
        c.characters.forEach(ch => {
          if (!chars.has(ch.name)) chars.set(ch.name, { role: ch.role, status: ch.status, chapters: [] });
          chars.get(ch.name).chapters.push(c.title);
        });
        (c.places || []).forEach(p => places.add(p));
        (c.houses || []).forEach(h => houses.add(h));
        (c.races || []).forEach(r => races.add(r));
        (c.terms || []).forEach(t => terms.add(t));
      });

      document.getElementById('count-chars').textContent = chars.size;
      document.getElementById('count-places').textContent = places.size;
      document.getElementById('count-houses').textContent = houses.size;
      document.getElementById('count-races').textContent = races.size;
      document.getElementById('count-terms').textContent = terms.size;

      document.getElementById('entities-chars').innerHTML = Array.from(chars.entries()).map(([name, data]) => `
        <div class="p-2.5 rounded bg-[#0d1117] border border-[#30363d]">
          <a href="${getWikiUrl(name)}" target="_blank" class="text-[#ff7b72] hover:underline font-bold text-xs inline-flex items-center gap-1">
            ${name} <span>↗</span>
          </a>
          <div class="text-[11px] text-[#8b949e] mt-0.5">${data.role}</div>
          <div class="text-[10px] text-[#ff7b72] italic mt-1 font-semibold">${data.status}</div>
          <div class="text-[9px] text-[#8b949e] mt-1 uppercase font-cinzel">Capitoli: ${data.chapters.join(', ')}</div>
        </div>
      `).join('');

      document.getElementById('entities-places').innerHTML = Array.from(places).map(p => `
        <div class="p-2 rounded bg-[#0d1117] border border-[#30363d]">
          <a href="${getWikiUrl(p)}" target="_blank" class="text-[#79c0ff] hover:underline text-xs font-semibold inline-flex items-center gap-1">
            ${p} <span>↗</span>
          </a>
        </div>
      `).join('');

      document.getElementById('entities-houses').innerHTML = Array.from(houses).map(h => `
        <div class="p-2 rounded bg-[#0d1117] border border-[#30363d]">
          <a href="${getWikiUrl(h)}" target="_blank" class="text-[#d29922] hover:underline text-xs font-semibold inline-flex items-center gap-1">
            ${h} <span>↗</span>
          </a>
        </div>
      `).join('');

      document.getElementById('entities-races').innerHTML = Array.from(races).map(r => `
        <div class="p-2 rounded bg-[#0d1117] border border-[#30363d]">
          <a href="${getWikiUrl(r)}" target="_blank" class="text-[#7ee787] hover:underline text-xs font-semibold inline-flex items-center gap-1">
            ${r} <span>↗</span>
          </a>
        </div>
      `).join('');

      document.getElementById('entities-terms').innerHTML = Array.from(terms).map(t => `
        <div class="p-2 rounded bg-[#0d1117] border border-[#30363d]">
          <a href="${getWikiUrl(t)}" target="_blank" class="text-[#d2a8ff] hover:underline text-xs font-semibold inline-flex items-center gap-1">
            ${t} <span>↗</span>
          </a>
        </div>
      `).join('');
    }

    function updatePovFilter() {
      const povSelect = document.getElementById('filter-pov');
      const povs = Array.from(new Set(chapters.map(c => c.pov)));
      povSelect.innerHTML = '<option value="all">Tutti i POV</option>' + 
        povs.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    window.deleteChapter = function(id) {
      if (confirm('Eliminare questo capitolo dal database?')) {
        chapters = chapters.filter(c => c.id !== id);
        selectedChapterId = chapters[0]?.id || null;
        saveState();
        updatePovFilter();
        renderChaptersList();
        renderChapterDetail();
        renderEntities();
      }
    };

    document.getElementById('tab-chapters').onclick = () => {
      document.getElementById('view-chapters').classList.remove('hidden');
      document.getElementById('view-entities').classList.add('hidden');
      document.getElementById('tab-chapters').className = 'px-4 py-2 font-cinzel text-xs tracking-wider uppercase border-b-2 border-[#d29922] font-bold text-[#d29922] bg-[#161b22] rounded-t';
      document.getElementById('tab-entities').className = 'px-4 py-2 font-cinzel text-xs tracking-wider uppercase border-b-2 border-transparent text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#161b22]/50 rounded-t transition';
    };

    document.getElementById('tab-entities').onclick = () => {
      document.getElementById('view-chapters').classList.add('hidden');
      document.getElementById('view-entities').classList.remove('hidden');
      document.getElementById('tab-entities').className = 'px-4 py-2 font-cinzel text-xs tracking-wider uppercase border-b-2 border-[#d29922] font-bold text-[#d29922] bg-[#161b22] rounded-t';
      document.getElementById('tab-chapters').className = 'px-4 py-2 font-cinzel text-xs tracking-wider uppercase border-b-2 border-transparent text-[#8b949e] hover:text-[#c9d1d9] hover:bg-[#161b22]/50 rounded-t transition';
      renderEntities();
    };

    document.getElementById('filter-book').onchange = renderChaptersList;
    document.getElementById('filter-pov').onchange = renderChaptersList;
    document.getElementById('filter-search').oninput = renderChaptersList;

    const modal = document.getElementById('modal-new-chapter');
    document.getElementById('btn-open-modal').onclick = () => modal.classList.remove('hidden');
    document.getElementById('btn-close-modal').onclick = () => modal.classList.add('hidden');
    document.getElementById('btn-cancel-modal').onclick = () => modal.classList.add('hidden');

    document.getElementById('form-chapter').onsubmit = (e) => {
      e.preventDefault();
      const title = document.getElementById('inp-title').value.trim();
      const charsArray = document.getElementById('inp-chars').value.split(',').map(s => s.trim()).filter(Boolean).map(name => ({
        name, role: "Personaggio registrato", status: "In vita"
      }));

      const newChap = {
        id: 'chap-' + Date.now(),
        title: title,
        book: document.getElementById('inp-book').value,
        pov: document.getElementById('inp-pov').value.trim(),
        place: document.getElementById('inp-place').value.trim(),
        chronology: "In sequenza",
        synopsis: document.getElementById('inp-synopsis').value.trim(),
        characters: charsArray,
        mentioned: document.getElementById('inp-mentioned').value.split(',').map(s => s.trim()).filter(Boolean),
        places: document.getElementById('inp-places-list').value.split(',').map(s => s.trim()).filter(Boolean),
        houses: document.getElementById('inp-houses').value.split(',').map(s => s.trim()).filter(Boolean),
        races: document.getElementById('inp-races').value.split(',').map(s => s.trim()).filter(Boolean),
        terms: document.getElementById('inp-terms').value.split(',').map(s => s.trim()).filter(Boolean),
        notes: document.getElementById('inp-notes').value.trim()
      };

      chapters.push(newChap);
      selectedChapterId = newChap.id;
      saveState();
      updatePovFilter();
      renderChaptersList();
      renderChapterDetail();
      renderEntities();
      modal.classList.add('hidden');
      document.getElementById('form-chapter').reset();
    };

    document.getElementById('btn-export-json').onclick = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chapters, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "asoiaf_database_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    document.getElementById('btn-export-csv').onclick = () => {
      let csv = "ID,Libro,Capitolo,POV,Luogo,Personaggi\n";
      chapters.forEach(c => {
        const charNames = c.characters.map(ch => ch.name).join('; ');
        csv += `"${c.id}","${c.book}","${c.title}","${c.pov}","${c.place}","${charNames}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "asoiaf_capitoli.csv");
      document.body.appendChild(link);
      link.click();
      link.remove();
    };

    document.getElementById('input-import-json').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            chapters = imported;
            selectedChapterId = chapters[0]?.id || null;
            saveState();
            updatePovFilter();
            renderChaptersList();
            renderChapterDetail();
            renderEntities();
            alert("Database importato con successo!");
          }
        } catch (err) {
          alert("File JSON non valido.");
        }
      };
      reader.readAsText(file);
    };

    updatePovFilter();
    renderChaptersList();
    renderChapterDetail();
  </script>
</body>
</html>
