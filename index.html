<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Song of Ice and Fire — Archivio Cronologico & Lore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@700&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            westeros: {
              bg: '#0c1017',
              panel: '#151c27',
              card: '#1e2838',
              border: '#2e3d52',
              gold: '#c69b3f',
              goldHover: '#dfb75c',
              text: '#f1f5f9',
              muted: '#94a3b8'
            }
          },
          fontFamily: {
            title: ['Cinzel', 'serif'],
            display: ['Cinzel Decorative', 'serif'],
            body: ['Lora', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0c1017;
      color: #f1f5f9;
      font-family: 'Lora', serif;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(198, 155, 63, 0.12) 0%, transparent 70%),
        linear-gradient(to bottom, #0c1017 0%, #06080c 100%);
      background-attachment: fixed;
    }
    .custom-scroll::-webkit-scrollbar { width: 7px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0f151f; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #2e3d52; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #c69b3f; }
    .tag-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      border-width: 1px;
    }
    .tag-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-600 selection:text-white">

  <!-- Header Superiore -->
  <header class="border-b border-westeros-border bg-westeros-panel/95 backdrop-blur-md sticky top-0 z-40 shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <span class="text-3xl text-westeros-gold drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)]">⚔️</span>
        <div>
          <h1 class="font-display text-xl md:text-2xl font-bold tracking-widest text-westeros-gold uppercase">A Song of Ice and Fire</h1>
          <p class="text-[11px] font-title text-westeros-muted uppercase tracking-widest font-semibold">Archivio Cronologico & Registro di Lore</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2 flex-wrap text-xs font-title">
        <button id="btn-export-json" class="px-3 py-1.5 rounded bg-westeros-card border border-westeros-border hover:border-westeros-gold text-westeros-text font-bold transition shadow">
          📥 Backup JSON
        </button>
        <button id="btn-export-csv" class="px-3 py-1.5 rounded bg-westeros-card border border-westeros-border hover:border-westeros-gold text-westeros-text font-bold transition shadow">
          📊 Esporta CSV
        </button>
        <label class="px-3 py-1.5 rounded bg-westeros-card border border-westeros-border hover:border-westeros-gold text-westeros-text font-bold transition cursor-pointer shadow">
          📤 Importa JSON
          <input type="file" id="input-import-json" accept=".json" class="hidden">
        </label>
        <button id="btn-open-modal" class="px-4 py-1.5 rounded bg-red-900/90 border border-red-700 hover:bg-red-800 text-red-100 font-bold uppercase tracking-wider transition shadow-lg">
          + Aggiungi Capitolo
        </button>
      </div>
    </div>
  </header>

  <!-- Controlli & Navigazione -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-westeros-border">
      
      <!-- Schede -->
      <div class="flex space-x-2">
        <button id="tab-chapters" class="px-4 py-2 font-title text-xs tracking-wider uppercase border-b-2 border-westeros-gold font-bold text-westeros-gold bg-westeros-card rounded-t transition">
          📖 Cronologia Capitoli
        </button>
        <button id="tab-entities" class="px-4 py-2 font-title text-xs tracking-wider uppercase border-b-2 border-transparent text-westeros-muted hover:text-westeros-text hover:bg-westeros-card/50 rounded-t transition">
          🏛️ Registro Generale Entità
        </button>
      </div>

      <!-- Filtri -->
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <input type="text" id="filter-search" placeholder="Cerca personaggi, luoghi, eventi..." 
          class="px-3 py-1.5 bg-westeros-card border border-westeros-border rounded text-sm w-full md:w-64 text-westeros-text placeholder-westeros-muted focus:outline-none focus:border-westeros-gold">
        
        <select id="filter-book" class="px-3 py-1.5 bg-westeros-card border border-westeros-border rounded text-xs font-title font-semibold text-westeros-text focus:outline-none focus:border-westeros-gold">
          <option value="all">Tutti i Libri</option>
          <option value="A Game of Thrones">A Game of Thrones</option>
          <option value="A Clash of Kings">A Clash of Kings</option>
          <option value="A Storm of Swords">A Storm of Swords</option>
          <option value="A Feast for Crows">A Feast for Crows</option>
          <option value="A Dance with Dragons">A Dance with Dragons</option>
        </select>

        <select id="filter-pov" class="px-3 py-1.5 bg-westeros-card border border-westeros-border rounded text-xs font-title font-semibold text-westeros-text focus:outline-none focus:border-westeros-gold">
          <option value="all">Tutti i POV</option>
        </select>
      </div>
    </div>

    <!-- SEZIONE 1: CAPITOLI -->
    <div id="view-chapters" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Elenco Laterale Capitoli -->
      <div class="lg:col-span-4 bg-westeros-panel border border-westeros-border rounded-xl p-3 shadow-2xl h-[calc(100vh-220px)] flex flex-col">
        <div class="text-[11px] font-title tracking-wider uppercase text-westeros-muted mb-2 px-2 font-bold flex justify-between border-b border-westeros-border/60 pb-2">
          <span>Capitoli Registrati</span>
          <span id="chapter-count" class="bg-westeros-card border border-westeros-border px-2 py-0.5 rounded text-westeros-gold font-bold">0</span>
        </div>
        <div id="chapters-list" class="space-y-2 overflow-y-auto custom-scroll flex-1 pr-1"></div>
      </div>

      <!-- Dettaglio Capitolo -->
      <div class="lg:col-span-8 bg-westeros-panel border border-westeros-border rounded-xl p-6 shadow-2xl overflow-y-auto custom-scroll h-[calc(100vh-220px)]" id="chapter-detail">
        <div class="text-center py-24 text-westeros-muted italic">Seleziona un capitolo dalla colonna di sinistra.</div>
      </div>

    </div>

    <!-- SEZIONE 2: REGISTRO GENERALE ENTITÀ -->
    <div id="view-entities" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
        
        <div class="bg-westeros-panel p-4 border border-westeros-border rounded-xl shadow-xl">
          <h3 class="font-title text-xs tracking-wider uppercase font-bold text-red-400 mb-3 flex items-center justify-between border-b border-westeros-border pb-2">
            <span>Personaggi</span>
            <span id="count-chars" class="bg-red-950/80 border border-red-800 text-red-200 px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-chars" class="space-y-2 max-h-[520px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <div class="bg-westeros-panel p-4 border border-westeros-border rounded-xl shadow-xl">
          <h3 class="font-title text-xs tracking-wider uppercase font-bold text-sky-400 mb-3 flex items-center justify-between border-b border-westeros-border pb-2">
            <span>Luoghi & Città</span>
            <span id="count-places" class="bg-sky-950/80 border border-sky-800 text-sky-200 px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-places" class="space-y-2 max-h-[520px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <div class="bg-westeros-panel p-4 border border-westeros-border rounded-xl shadow-xl">
          <h3 class="font-title text-xs tracking-wider uppercase font-bold text-amber-400 mb-3 flex items-center justify-between border-b border-westeros-border pb-2">
            <span>Casate Nobili</span>
            <span id="count-houses" class="bg-amber-950/80 border border-amber-800 text-amber-200 px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-houses" class="space-y-2 max-h-[520px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <div class="bg-westeros-panel p-4 border border-westeros-border rounded-xl shadow-xl">
          <h3 class="font-title text-xs tracking-wider uppercase font-bold text-emerald-400 mb-3 flex items-center justify-between border-b border-westeros-border pb-2">
            <span>Popoli & Fazioni</span>
            <span id="count-races" class="bg-emerald-950/80 border border-emerald-800 text-emerald-200 px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-races" class="space-y-2 max-h-[520px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

        <div class="bg-westeros-panel p-4 border border-westeros-border rounded-xl shadow-xl">
          <h3 class="font-title text-xs tracking-wider uppercase font-bold text-purple-400 mb-3 flex items-center justify-between border-b border-westeros-border pb-2">
            <span>Termini & Oggetti</span>
            <span id="count-terms" class="bg-purple-950/80 border border-purple-800 text-purple-200 px-2 py-0.5 rounded text-[11px]">0</span>
          </h3>
          <div id="entities-terms" class="space-y-2 max-h-[520px] overflow-y-auto custom-scroll text-sm"></div>
        </div>

      </div>
    </div>
  </main>

  <!-- Modale Aggiungi Capitolo -->
  <div id="modal-new-chapter" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-westeros-panel border border-westeros-border rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-westeros-border flex justify-between items-center bg-westeros-card">
        <h3 class="font-title text-sm tracking-wider uppercase font-bold text-westeros-gold">Aggiungi Capitolo al Database</h3>
        <button id="btn-close-modal" class="text-westeros-muted hover:text-white text-2xl font-bold">&times;</button>
      </div>

      <form id="form-chapter" class="p-5 overflow-y-auto custom-scroll space-y-4 text-xs font-semibold">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block uppercase tracking-wider text-westeros-muted mb-1">Titolo Capitolo</label>
            <input type="text" id="inp-title" required placeholder="es. Catelyn I" class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-westeros-muted mb-1">Libro</label>
            <select id="inp-book" class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
              <option value="A Game of Thrones">A Game of Thrones</option>
              <option value="A Clash of Kings">A Clash of Kings</option>
              <option value="A Storm of Swords">A Storm of Swords</option>
              <option value="A Feast for Crows">A Feast for Crows</option>
              <option value="A Dance with Dragons">A Dance with Dragons</option>
            </select>
          </div>
          <div>
            <label class="block uppercase tracking-wider text-westeros-muted mb-1">Punto di Vista (P.O.V.)</label>
            <input type="text" id="inp-pov" required placeholder="es. Catelyn" class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-westeros-muted mb-1">Luogo Principale</label>
            <input type="text" id="inp-place" required placeholder="es. Winterfell" class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
        </div>

        <div>
          <label class="block uppercase tracking-wider text-westeros-muted mb-1">Sinossi Funzionale</label>
          <textarea id="inp-synopsis" rows="4" required class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text leading-relaxed"></textarea>
        </div>

        <div class="border-t border-westeros-border pt-3 space-y-3">
          <div>
            <label class="block uppercase tracking-wider text-red-400 mb-1">Personaggi Presenti (separati da virgola)</label>
            <input type="text" id="inp-chars" placeholder="Catelyn Stark, Eddard Stark, Maester Luwin..." class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-red-400 mb-1">Personaggi Menzionati</label>
            <input type="text" id="inp-mentioned" placeholder="Jon Arryn, Robert Baratheon..." class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-sky-400 mb-1">Luoghi Citati</label>
            <input type="text" id="inp-places-list" placeholder="King's Landing, Eyrie..." class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-amber-400 mb-1">Casate Nobili</label>
            <input type="text" id="inp-houses" placeholder="House Tully, House Arryn, House Stark..." class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-emerald-400 mb-1">Popoli, Razze & Fazioni</label>
            <input type="text" id="inp-races" placeholder="First Men, Night's Watch..." class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-purple-400 mb-1">Termini & Oggetti</label>
            <input type="text" id="inp-terms" placeholder="Hand of the King, Heart tree..." class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-westeros-muted mb-1">Note & Foreshadowing</label>
            <textarea id="inp-notes" rows="2" class="w-full px-3 py-2 bg-westeros-card border border-westeros-border rounded text-westeros-text"></textarea>
          </div>
        </div>

        <div class="pt-3 border-t border-westeros-border flex justify-end gap-2">
          <button type="button" id="btn-cancel-modal" class="px-4 py-1.5 border border-westeros-border rounded text-westeros-muted hover:text-white">Annulla</button>
          <button type="submit" class="px-5 py-1.5 bg-red-900 border border-red-700 text-white rounded font-bold uppercase tracking-wider hover:bg-red-800">Salva</button>
        </div>
      </form>
    </div>
  </div>

      'casa royce': 'House_Royce',
      'casa mallister': 'House_Mallister',
      'casa greyjoy': 'House_Greyjoy',
      'casa cassel': 'House_Cassel',
      'casa baratheon': 'House_Baratheon',
      'casa targaryen': 'House_Targaryen',
      'casa arryn': 'House_Arryn',
      'casa tully': 'House_Tully',
      'casa lannister': 'House_Lannister',
      'grande inverno': 'Winterfell',
      'la barriera': 'The_Wall',
      'oltre la barriera': 'Beyond_the_Wall',
      'bosco stregato': 'Haunted_Forest',
      'castello nero': 'Castle_Black',
      'approdo del re': "King's_Landing",
      'isole di ferro': 'Iron_Islands',
      'pyke': 'Pyke_(castle)',
      'valyria': 'Valyria',
      'gli estranei': 'Others',
      'estranei': 'Others',
      'guardiani della notte': "Night's_Watch",
      'popolo libero': 'Free_Folk',
      'bruti': 'Free_Folk',
      'non-morti': 'Wights',
      'primi uomini': 'First_Men',
      'metalupi': 'Direwolf',
      'metalupo': 'Direwolf',
      'ghiaccio': 'Ice_(sword)',
      'acciaio di valyria': 'Valyrian_steel',
      'albero sentinella': 'Sentinel_tree',
      'legnoferro': 'Ironwood',
      'confratello giurato': "Night's_Watch#Organization"
    };

    function getWikiUrl(entityName) {
      if (!entityName) return '#';
      let clean = entityName.split('(')[0].trim();
      const lower = clean.toLowerCase();

      if (CANON_MAPPING[lower]) {
        return `https://awoiaf.westeros.org/index.php/${CANON_MAPPING[lower]}`;
      }
      if (lower.startsWith('casa ')) {
        const houseName = clean.substring(5).trim();
        return `https://awoiaf.westeros.org/index.php/House_${encodeURIComponent(houseName)}`;
      }
      return `https://awoiaf.westeros.org/index.php?search=${encodeURIComponent(clean)}&title=Special%3ASearch&go=Go`;
    }

    function makeBadge(name, type) {
      const url = getWikiUrl(name);
      let styles = '';
      if (type === 'char')  styles = 'bg-red-950/70 border-red-800 text-red-200 hover:bg-red-900 hover:text-white';
      if (type === 'place') styles = 'bg-sky-950/70 border-sky-800 text-sky-200 hover:bg-sky-900 hover:text-white';
      if (type === 'house') styles = 'bg-amber-950/70 border-amber-800 text-amber-200 hover:bg-amber-900 hover:text-white';
      if (type === 'race')  styles = 'bg-emerald-950/70 border-emerald-800 text-emerald-200 hover:bg-emerald-900 hover:text-white';
      if (type === 'item')  styles = 'bg-purple-950/70 border-purple-800 text-purple-200 hover:bg-purple-900 hover:text-white';

      return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="tag-link ${styles}" title="Apri voce su A Wiki of Ice and Fire">
        <span>${name}</span>
        <span class="text-[10px] opacity-60">↗</span>
      </a>`;
    }

          { name: "Gared", role: "Disertore dei Guardiani della Notte superstite del Prologo.", status: "Deceduto (decapitato da Eddard Stark)" },
          { name: "Jory Cassel", role: "Capitano della guardia di Grande Inverno.", status: "In vita" },
          { name: "Hullen", role: "Mastro dei cavalli di Grande Inverno.", status: "In vita" },
          { name: "Harwin", role: "Guardia di Grande Inverno, figlio di Hullen.", status: "In vita" },
          { name: "Direwolf", role: "5 cuccioli per i figli legittimi + 1 albino dagli occhi rossi (Ghost).", status: "In vita" }
        ],
        mentioned: ["Mance Rayder", "Robert I Baratheon", "Catelyn Stark", "Sansa Stark", "Arya Stark", "Rickon Stark"],
        places: ["Winterfell", "The Wall", "Iron Islands", "Pyke", "Valyria", "King's Landing"],
        houses: ["House Stark", "House Greyjoy", "House Cassel", "House Baratheon", "House Targaryen"],
        races: ["First Men", "Night's Watch", "Free Folk", "Direwolf"],
        terms: ["Ice", "Valyrian steel", "Ironwood", "Warden of the North", "Greatsword"],
        notes: "• Il metalupo ucciso dal corno di cervo prefigura il destino tragico di Casa Stark provocato da Casa Baratheon.\n• Ned crede erroneamente che Gared sia fuggito per paura dei bruti di Mance Rayder, ignorando il risveglio degli Estranei.\n• Il sesto cucciolo albino, muto e appartato, simboleggia la condizione e il destino singolare di Jon Snow."
      }
    ];

    let chapters = JSON.parse(localStorage.getItem('asoiaf_db_dark_v1')) || DEFAULT_DATA;
    let selectedChapterId = chapters[0]?.id || null;

    function saveState() {
      localStorage.setItem('asoiaf_db_dark_v1', JSON.stringify(chapters));
    }

    function renderChaptersList() {
      const container = document.getElementById('chapters-list');
      const bookFilter = document.getElementById('filter-book').value;
      const povFilter = document.getElementById('filter-pov').value;
      const searchFilter = document.getElementById('filter-search').value.toLowerCase();

      const filtered = chapters.filter(c => {
        const matchesBook = (bookFilter === 'all' || c.book === bookFilter);
        const matchesPov = (povFilter === 'all' || c.pov === povFilter);
        const matchesSearch = !searchFilter || 
          c.title.toLowerCase().includes(searchFilter) ||
          c.synopsis.toLowerCase().includes(searchFilter) ||
          c.characters.some(ch => ch.name.toLowerCase().includes(searchFilter)) ||
          c.places.some(p => p.toLowerCase().includes(searchFilter));
        return matchesBook && matchesPov && matchesSearch;
      });

      document.getElementById('chapter-count').textContent = `${filtered.length} di ${chapters.length}`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-xs text-westeros-muted italic p-3 text-center">Nessun capitolo trovato.</p>';
        return;
      }

      filtered.forEach(c => {
        const isSelected = (c.id === selectedChapterId);
        const card = document.createElement('div');
        card.className = `p-3 rounded-lg border transition-all cursor-pointer ${
          isSelected 
            ? 'bg-westeros-card border-westeros-gold shadow-lg shadow-black/50' 
            : 'bg-westeros-panel/80 hover:bg-westeros-card/70 border-westeros-border/70'
        }`;
        card.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <h4 class="font-title font-bold text-sm text-westeros-text">${c.title}</h4>
            <span class="text-[10px] font-title px-1.5 py-0.5 rounded bg-red-950 border border-red-800 text-red-200 font-bold">${c.pov}</span>
          </div>
          <p class="text-xs text-sky-400 truncate">${c.place}</p>
          <p class="text-[10px] text-westeros-muted font-title mt-1 tracking-wider uppercase">${c.book}</p>
        `;
        card.onclick = () => {
          selectedChapterId = c.id;
          renderChaptersList();
          renderChapterDetail();
        };
        container.appendChild(card);
      });
    }

    function renderChapterDetail() {
      const container = document.getElementById('chapter-detail');
      const c = chapters.find(item => item.id === selectedChapterId);

      if (!c) {
        container.innerHTML = '<div class="text-center py-24 text-westeros-muted italic">Seleziona un capitolo.</div>';
        return;
      }

      container.innerHTML = `
        <div class="space-y-6">
          <div class="border-b border-westeros-border pb-4">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
              <span class="text-xs font-title tracking-widest uppercase text-westeros-gold font-bold">${c.book}</span>
              <span class="text-[11px] font-title bg-westeros-card border border-westeros-border px-2.5 py-1 rounded text-westeros-muted">${c.chronology || 'In sequenza'}</span>
            </div>
            <h2 class="font-title text-2xl md:text-3xl font-bold text-westeros-text tracking-wide">${c.title}</h2>
            <div class="flex flex-wrap gap-4 mt-2 text-xs font-semibold text-westeros-muted">
              <span>P.O.V.: <strong class="text-red-400 font-title font-bold">${c.pov}</strong></span>
              <span>•</span>
              <span>Luogo: <a href="${getWikiUrl(c.place)}" target="_blank" class="text-sky-400 hover:text-sky-300 underline font-semibold">${c.place} ↗</a></span>
            </div>
          </div>

          <!-- Sinossi -->
          <div>
            <h4 class="font-title text-xs tracking-wider uppercase font-bold text-westeros-gold mb-2">Sinossi Funzionale</h4>
            <div class="text-sm leading-relaxed bg-westeros-card/70 p-4 rounded-lg border border-westeros-border text-slate-200 space-y-3 font-normal">
              ${c.synopsis.split('\n\n').map(p => `<p>${p}</p>`).join('')}
            </div>
          </div>

          <!-- Personaggi Presenti -->
          <div>
            <h4 class="font-title text-xs tracking-wider uppercase font-bold text-westeros-gold mb-3">Personaggi Presenti (${c.characters.length})</h4>
            <div class="overflow-x-auto rounded-lg border border-westeros-border shadow-md">
              <table class="w-full text-left text-xs border-collapse bg-westeros-card/50">
                <thead>
                  <tr class="bg-westeros-card border-b border-westeros-border font-title text-[11px] text-westeros-muted uppercase">
                    <th class="p-3">Nome (Link AWOIAF)</th>
                    <th class="p-3">Ruolo / Profilo</th>
                    <th class="p-3">Stato</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-westeros-border/60">
                  ${c.characters.map(ch => `
                    <tr class="hover:bg-westeros-card/90 transition">
                      <td class="p-3 font-bold">
                        <a href="${getWikiUrl(ch.name)}" target="_blank" class="text-red-400 hover:text-red-300 inline-flex items-center gap-1 font-semibold">
                          ${ch.name} <span class="text-[10px] opacity-70">↗</span>
                        </a>
                      </td>
                      <td class="p-3 text-slate-300">${ch.role}</td>
                      <td class="p-3 italic text-westeros-muted font-medium">${ch.status}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Griglie Entità -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <div class="bg-westeros-card/60 p-3.5 rounded-lg border border-westeros-border">
              <h5 class="font-title text-[11px] uppercase tracking-wider font-bold text-red-400 mb-2">Personaggi Menzionati</h5>
              <div class="flex flex-wrap gap-1.5">
                ${c.mentioned.map(m => makeBadge(m, 'char')).join('')}
              </div>
            </div>

            <div class="bg-westeros-card/60 p-3.5 rounded-lg border border-westeros-border">
              <h5 class="font-title text-[11px] uppercase tracking-wider font-bold text-sky-400 mb-2">Luoghi & Città Citati</h5>
              <div class="flex flex-wrap gap-1.5">
                ${c.places.map(p => makeBadge(p, 'place')).join('')}
              </div>
            </div>

            <div class="bg-westeros-card/60 p-3.5 rounded-lg border border-westeros-border">
              <h5 class="font-title text-[11px] uppercase tracking-wider font-bold text-amber-400 mb-2">Casate Nobili</h5>
              <div class="flex flex-wrap gap-1.5">
                ${c.houses.map(h => makeBadge(h, 'house')).join('')}
              </div>
            </div>

            <div class="bg-westeros-card/60 p-3.5 rounded-lg border border-westeros-border">
              <h5 class="font-title text-[11px] uppercase tracking-wider font-bold text-emerald-400 mb-2">Popoli & Fazioni</h5>
              <div class="flex flex-wrap gap-1.5">
                ${(c.races || []).map(r => makeBadge(r, 'race')).join('')}
              </div>
            </div>

          </div>

          <!-- Termini -->
          <div class="bg-westeros-card/60 p-3.5 rounded-lg border border-westeros-border">
            <h5 class="font-title text-[11px] uppercase tracking-wider font-bold text-purple-400 mb-2">Termini & Oggetti di Lore</h5>
            <div class="flex flex-wrap gap-1.5">
              ${c.terms.map(t => makeBadge(t, 'item')).join('')}
            </div>
          </div>

          <!-- Note Critiche -->
          ${c.notes ? `
            <div>
              <h4 class="font-title text-xs tracking-wider uppercase font-bold text-westeros-gold mb-2">Note Critiche & Presagi</h4>
              <div class="text-xs bg-amber-950/20 p-4 rounded-lg border border-amber-900/40 space-y-1.5 text-amber-100/90 leading-relaxed">
                ${c.notes.split('\n').map(n => `<p>${n}</p>`).join('')}
              </div>
            </div>
          ` : ''}

          <div class="pt-4 border-t border-westeros-border flex justify-end">
            <button onclick="deleteChapter('${c.id}')" class="text-xs text-red-400/80 hover:text-red-300 hover:underline">Elimina questo capitolo</button>
          </div>
        </div>
      `;
    }

    function renderEntities() {
      const chars = new Map();
      const places = new Set();
      const houses = new Set();
      const races = new Set();
      const terms = new Set();

      chapters.forEach(c => {
        c.characters.forEach(ch => {
          if (!chars.has(ch.name)) chars.set(ch.name, { role: ch.role, status: ch.status, chapters: [] });
          chars.get(ch.name).chapters.push(c.title);
        });
        (c.places || []).forEach(p => places.add(p));
        (c.houses || []).forEach(h => houses.add(h));
        (c.races || []).forEach(r => races.add(r));
        (c.terms || []).forEach(t => terms.add(t));
      });

      document.getElementById('count-chars').textContent = chars.size;
      document.getElementById('count-places').textContent = places.size;
      document.getElementById('count-houses').textContent = houses.size;
      document.getElementById('count-races').textContent = races.size;
      document.getElementById('count-terms').textContent = terms.size;

      document.getElementById('entities-chars').innerHTML = Array.from(chars.entries()).map(([name, data]) => `
        <div class="p-2.5 rounded bg-westeros-card border border-westeros-border">
          <a href="${getWikiUrl(name)}" target="_blank" class="text-red-400 hover:text-red-300 font-bold text-xs inline-flex items-center gap-1">
            ${name} <span>↗</span>
          </a>
          <div class="text-[11px] text-westeros-muted mt-0.5">${data.role}</div>
          <div class="text-[10px] text-red-300 italic mt-1 font-semibold">${data.status}</div>
          <div class="text-[9px] text-westeros-muted mt-1 uppercase font-title">Capitoli: ${data.chapters.join(', ')}</div>
        </div>
      `).join('');

      document.getElementById('entities-places').innerHTML = Array.from(places).map(p => `
        <div class="p-2 rounded bg-westeros-card border border-westeros-border">
          <a href="${getWikiUrl(p)}" target="_blank" class="text-sky-400 hover:text-sky-300 text-xs font-semibold inline-flex items-center gap-1">
            ${p} <span>↗</span>
          </a>
        </div>
      `).join('');

      document.getElementById('entities-houses').innerHTML = Array.from(houses).map(h => `
        <div class="p-2 rounded bg-westeros-card border border-westeros-border">
          <a href="${getWikiUrl(h)}" target="_blank" class="text-amber-400 hover:text-amber-300 text-xs font-semibold inline-flex items-center gap-1">
            ${h} <span>↗</span>
          </a>
        </div>
      `).join('');

      document.getElementById('entities-races').innerHTML = Array.from(races).map(r => `
        <div class="p-2 rounded bg-westeros-card border border-westeros-border">
          <a href="${getWikiUrl(r)}" target="_blank" class="text-emerald-400 hover:text-emerald-300 text-xs font-semibold inline-flex items-center gap-1">
            ${r} <span>↗</span>
          </a>
        </div>
      `).join('');

      document.getElementById('entities-terms').innerHTML = Array.from(terms).map(t => `
        <div class="p-2 rounded bg-westeros-card border border-westeros-border">
          <a href="${getWikiUrl(t)}" target="_blank" class="text-purple-400 hover:text-purple-300 text-xs font-semibold inline-flex items-center gap-1">
            ${t} <span>↗</span>
          </a>
        </div>
      `).join('');
    }

    function updatePovFilter() {
      const povSelect = document.getElementById('filter-pov');
      const povs = Array.from(new Set(chapters.map(c => c.pov)));
      povSelect.innerHTML = '<option value="all">Tutti i POV</option>' + 
        povs.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    window.deleteChapter = function(id) {
      if (confirm('Eliminare questo capitolo dal database?')) {
        chapters = chapters.filter(c => c.id !== id);
        selectedChapterId = chapters[0]?.id || null;
        saveState();
        updatePovFilter();
        renderChaptersList();
        renderChapterDetail();
        renderEntities();
      }
    };

    document.getElementById('tab-chapters').onclick = () => {
      document.getElementById('view-chapters').classList.remove('hidden');
      document.getElementById('view-entities').classList.add('hidden');
      document.getElementById('tab-chapters').className = 'px-4 py-2 font-title text-xs tracking-wider uppercase border-b-2 border-westeros-gold font-bold text-westeros-gold bg-westeros-card rounded-t transition';
      document.getElementById('tab-entities').className = 'px-4 py-2 font-title text-xs tracking-wider uppercase border-b-2 border-transparent text-westeros-muted hover:text-westeros-text hover:bg-westeros-card/50 rounded-t transition';
    };

    document.getElementById('tab-entities').onclick = () => {
      document.getElementById('view-chapters').classList.add('hidden');
      document.getElementById('view-entities').classList.remove('hidden');
      document.getElementById('tab-entities').className = 'px-4 py-2 font-title text-xs tracking-wider uppercase border-b-2 border-westeros-gold font-bold text-westeros-gold bg-westeros-card rounded-t transition';
      document.getElementById('tab-chapters').className = 'px-4 py-2 font-title text-xs tracking-wider uppercase border-b-2 border-transparent text-westeros-muted hover:text-westeros-text hover:bg-westeros-card/50 rounded-t transition';
      renderEntities();
    };

    document.getElementById('filter-book').onchange = renderChaptersList;
    document.getElementById('filter-pov').onchange = renderChaptersList;
    document.getElementById('filter-search').oninput = renderChaptersList;

    const modal = document.getElementById('modal-new-chapter');
    document.getElementById('btn-open-modal').onclick = () => modal.classList.remove('hidden');
    document.getElementById('btn-close-modal').onclick = () => modal.classList.add('hidden');
    document.getElementById('btn-cancel-modal').onclick = () => modal.classList.add('hidden');

    document.getElementById('form-chapter').onsubmit = (e) => {
      e.preventDefault();
      const title = document.getElementById('inp-title').value.trim();
      const charsArray = document.getElementById('inp-chars').value.split(',').map(s => s.trim()).filter(Boolean).map(name => ({
        name, role: "Personaggio registrato", status: "In vita"
      }));

      const newChap = {
        id: 'chap-' + Date.now(),
        title: title,
        book: document.getElementById('inp-book').value,
        pov: document.getElementById('inp-pov').value.trim(),
        place: document.getElementById('inp-place').value.trim(),
        chronology: "In sequenza",
        synopsis: document.getElementById('inp-synopsis').value.trim(),
        characters: charsArray,
        mentioned: document.getElementById('inp-mentioned').value.split(',').map(s => s.trim()).filter(Boolean),
        places: document.getElementById('inp-places-list').value.split(',').map(s => s.trim()).filter(Boolean),
        houses: document.getElementById('inp-houses').value.split(',').map(s => s.trim()).filter(Boolean),
        races: document.getElementById('inp-races').value.split(',').map(s => s.trim()).filter(Boolean),
        terms: document.getElementById('inp-terms').value.split(',').map(s => s.trim()).filter(Boolean),
        notes: document.getElementById('inp-notes').value.trim()
      };

      chapters.push(newChap);
      selectedChapterId = newChap.id;
      saveState();
      updatePovFilter();
      renderChaptersList();
      renderChapterDetail();
      renderEntities();
      modal.classList.add('hidden');
      document.getElementById('form-chapter').reset();
    };

    document.getElementById('btn-export-json').onclick = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chapters, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "asoiaf_database_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    document.getElementById('btn-export-csv').onclick = () => {
      let csv = "ID,Libro,Capitolo,POV,Luogo,Personaggi\n";
      chapters.forEach(c => {
        const charNames = c.characters.map(ch => ch.name).join('; ');
        csv += `"${c.id}","${c.book}","${c.title}","${c.pov}","${c.place}","${charNames}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "asoiaf_capitoli.csv");
      document.body.appendChild(link);
      link.click();
      link.remove();
    };

    document.getElementById('input-import-json').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            chapters = imported;
            selectedChapterId = chapters[0]?.id || null;
            saveState();
            updatePovFilter();
            renderChaptersList();
            renderChapterDetail();
            renderEntities();
            alert("Database importato con successo!");
          }
        } catch (err) {
          alert("File JSON non valido.");
        }
      };
      reader.readAsText(file);
    };

    updatePovFilter();
    renderChaptersList();
    renderChapterDetail();
  </script>
</body>
</html>
